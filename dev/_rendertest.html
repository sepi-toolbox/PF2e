<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // ── Firebase/네트워크 스텁 (렌더 하니스: 실제 저장/인증 없이 UI만) ──
  window.firebase = { firestore: function(){ var f=function(){return f;}; f.collection=f; f.doc=f; f.get=function(){return Promise.resolve({exists:false});}; f.FieldValue={serverTimestamp:function(){return 0;},delete:function(){return 0;}}; f.Timestamp={now:function(){return {toMillis:function(){return 0;}};}}; return f; }, auth: function(){ return { onAuthStateChanged:function(){}, }; } };
  window.db = null; window.currentUser = null;
</script>
<!-- 앱 스크립트 (Firebase SDK·auth 제외) -->
<script src="equipment_db.js"></script>
<script src="class_features_db.js"></script>
<script src="effects_db.js"></script>
<script src="prereqs_db.js"></script>
<script src="cs_data.js"></script>
<script src="cs_calc.js"></script>
<script src="cs_pf2e.js"></script>
<script src="cs_re_engine.js"></script>
<script src="cs_pf2e_stats.js"></script>
<script src="cs_pf2e_equip.js"></script>
<script src="cs_pf2e_anc.js"></script>
<script src="cs_pf2e_bg.js"></script>
<script src="cs_pf2e_spell.js"></script>
<script src="cs_pf2e_deity.js"></script>
<script src="cs_pf2e_action.js"></script>
<script src="cs_pf2e_feat.js"></script>
<script src="cs_pf2e_class.js"></script>
<script src="cs_pf2e_actor.js"></script>
<script src="cs_ui.js"></script>
<script src="cs_modal.js"></script>
<script src="cs_feat_effects.js"></script>
<style>body{margin:0;background:#1a1512;}#growth-plan{max-width:380px;padding:8px;}</style>
</head>
<body>
<!-- renderGrowthPlan/보조 함수가 참조하는 최소 DOM -->
<input type="hidden" id="level" value="1">
<input type="hidden" id="f-level" value="1">
<div id="growth-plan"></div>
<div id="growth-plan-mobile"></div>
<div id="spell-panel-host"></div>

<!-- 모달 셸(index.html 복제) — ?modal=boost|skill 로 해당 모달 렌더 확인 -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header" id="modal-header-bar">
      <h2 id="modal-title" style="flex:1;">선택</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
      <button id="modal-close-m" class="modal-close-mobile" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="modal-list">
        <div class="modal-list-header">
          <input class="modal-search" id="modal-search" placeholder="검색..." oninput="filterOptions()">
          <div class="modal-filters" id="modal-filterbar"></div>
        </div>
        <div class="modal-list-items" id="modal-options"></div>
      </div>
      <div class="modal-detail" id="modal-detail">
        <div class="modal-detail-empty">항목을 선택하면 상세 정보가 표시됩니다.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal()">닫기</button>
      <button class="btn btn-confirm" onclick="confirmModal()">선택</button>
    </div>
  </div>
</div>

<div id="boot-status" style="color:#fff;font:12px monospace;padding:8px;"></div>
<script>
(async function(){
  var log = function(m){ var el=document.getElementById('boot-status'); if(el) el.textContent += m+' | '; };
  try {
    // 1) index.html의 <style> 런타임 주입(동일 CSS)
    var htmlTxt = await (await fetch('index.html')).text();
    var m, re = /<style[^>]*>([\s\S]*?)<\/style>/g, css='';
    while ((m = re.exec(htmlTxt))) css += m[1] + '\n';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    log('css:'+css.length);

    // 2) 카탈로그 로드
    if (typeof _ensureAllCatalogs === 'function') { await _ensureAllCatalogs(); log('catalogs'); }

    // 3) 목 state (URL 파라미터: ?class=cleric&level=1)
    var Q = new URLSearchParams(location.search);
    var clsId = Q.get('class') || 'cleric';
    var lvl = Q.get('level') || '1';
    var lvEl = document.getElementById('level'); if (lvEl) lvEl.value = lvl;
    var lvEl2 = document.getElementById('f-level'); if (lvEl2) lvEl2.value = lvl;
    if (typeof PF2eClass !== 'undefined' && PF2eClass.getClassLegacy) state.selectedClass = PF2eClass.getClassLegacy(clsId);
    if (typeof PF2eAnc !== 'undefined') { try { state.selectedAncestry = PF2eAnc.getAncestryLegacy('human'); } catch(e){} }
    if (typeof PF2eBg !== 'undefined') { try {
      var _bg = PF2eBg.getBackgroundLegacy('acolyte') || PF2eBg.getBackgroundLegacy('acrobat');
      if (!_bg) { var bgs = PF2eBg.backgroundList ? PF2eBg.backgroundList() : (PF2eBg.list ? PF2eBg.list() : []); _bg = (bgs && bgs.length) ? bgs[0] : null; }
      if (_bg) state.selectedBackground = _bg;
    } catch(e){ log('bgErr:'+e.message); } }
    // 신격: 목록에서 성별화 2택 + 폰트 있는 것 하나
    try {
      var dl = (typeof _allDeities === 'function') ? _allDeities() : (typeof PF2eDeity !== 'undefined' && PF2eDeity.list ? PF2eDeity.list() : []);
      var pick = dl.find(function(d){ return (d.sanctification||[]).length>=1 && (d.font||[]).length; }) || dl[0];
      if (pick) state.deity = pick.id;
    } catch(e){ log('deityErr'); }
    state.trainableSkillSlots = (state.selectedClass && state.selectedClass.free_skill_count) || 2;
    state.growth = state.growth || {};
    // 채워진 박스 확인용: 교리/성별화/신성원천도 세팅(있으면)
    try {
      var _cid = state.selectedClass && state.selectedClass.id;
      var _docs = (typeof SUBCLASS_DB !== 'undefined' && _cid) ? SUBCLASS_DB.filter(function(s){return s.class_id===_cid;}) : [];
      var _subQ = Q.get('sub');   // ?sub=doctrine-warpriest 로 서브클래스 지정, ?sub=none 이면 미선택
      if (_subQ === 'none') { state.selectedSubclass = null; }
      else if (_subQ) { state.selectedSubclass = _docs.find(function(s){return s.id===_subQ;}) || _docs[0]; }
      else if (_docs.length) state.selectedSubclass = _docs[0];
      var _dd = state.deity && typeof _getDeity==='function' ? _getDeity(state.deity) : null;
      if (_dd) { if ((_dd.sanctification||[]).length) state.sanctification = _dd.sanctification[0]; if ((_dd.font||[]).length) state.divineFont = _dd.font[0]; }
    } catch(e){}
    log('cls:'+(state.selectedClass?state.selectedClass.id:'none')+' deity:'+state.deity);

    // 3a) 기술 훈련 미리선택(검증용): ?trainpick=acrobatics,arcana
    var _tp = Q.get('trainpick');
    if (_tp) { state.growth[1] = state.growth[1] || {}; state.growth[1].skillTraining = _tp.split(','); }
    // 3a') 기술 증가 모달 검증용: ?modal=skillincrease&siLevel=N&siPick=athletics (해당 레벨 증가 사전선택 → 재오픈 하이라이트 확인)
    if (Q.get('modal') === 'skillincrease') {
      var _siLv = parseInt(Q.get('siLevel') || lvl) || 3;
      var _siPick = Q.get('siPick');
      if (_siPick) { state.growth[_siLv] = state.growth[_siLv] || {}; state.growth[_siLv].skillIncrease = _siPick; }
    }

    // 3b) 기술 숙련 DOM(sk-prof-*) 주입 — 기술 모달이 참조. recalcAll이 훈련값 기록.
    if (typeof SKILLS !== 'undefined') {
      var skHost = document.createElement('div'); skHost.style.display = 'none';
      skHost.innerHTML = SKILLS.map(function(s){ return '<select id="sk-prof-'+s.id+'"><option value="0"></option><option value="2"></option><option value="4"></option><option value="6"></option><option value="8"></option></select><span id="sk-val-'+s.id+'"></span>'; }).join('');
      document.body.appendChild(skHost);
    }

    // 3c) 스펠 탭(?panel=spells) — index.html의 panel-spells 주입 + 클레릭 주문 상태 + renderSpells
    if (Q.get('panel') === 'spells') {
      var _pi = htmlTxt.indexOf('<div id="panel-spells"');
      var _pe = htmlTxt.indexOf('id="panel-pets"');
      if (_pi >= 0 && _pe > _pi) {
        var _slice = htmlTxt.slice(_pi, htmlTxt.lastIndexOf('<', _pe));  // panel-spells ~ 직전
        document.getElementById('spell-panel-host').innerHTML = _slice;
        var _ps = document.getElementById('panel-spells'); if (_ps) { _ps.classList.add('active'); _ps.style.display = 'block'; }
        // 스펠 탭만 보이게 성장 플랜 숨김
        var _gp = document.getElementById('growth-plan'); if (_gp) _gp.style.display = 'none';
        var _gpm = document.getElementById('growth-plan-mobile'); if (_gpm) _gpm.style.display = 'none';
      }
      // 클레릭 주문 상태(목: 레벨1 준비형 + 신성 원천 해악)
      state.spellSlots = state.spellSlots || {}; state.spellSlots[1] = 2;
      state.cantripSlots = 5;
      state.preparedSpells = state.preparedSpells || { cantrip: [], 1: [] };
      state.divineFont = Q.get('font') || 'harm';
      state.divineFontUsed = 0;
      state.spells = state.spells || { cantrip: [], known: [], focus: [], innate: [] };
    }

    // 4) 유효성 판정 + 렌더
    if (typeof _resolveChoiceValidity === 'function') _resolveChoiceValidity();
    try { if (typeof recalcAll === 'function') recalcAll(); log('recalc'); } catch(e){ log('recalcErr:'+e.message); }
    if (typeof renderGrowthPlan === 'function') renderGrowthPlan();
    if (Q.get('panel') === 'spells') {
      try { if (typeof renderSpells === 'function') renderSpells(); log('spells'); } catch(e){ log('spellsErr:'+e.message); console.error(e); }
      try { if (typeof switchSpellSubtab === 'function') switchSpellSubtab(Q.get('sub') || 'class'); } catch(e){ log('subErr:'+e.message); }
    }
    log('rendered');

    // 5) 모달 렌더(옵션): ?modal=boost | skill
    var modal = Q.get('modal');
    if (modal === 'boost' && typeof openBoostModal === 'function') { openBoostModal(); log('boostModal'); }
    else if (modal === 'skill' && typeof growthPickSkillTrainingMulti === 'function') { growthPickSkillTrainingMulti(); log('skillModal'); }
    else if (modal === 'deityskill' && typeof openDeitySkillInfo === 'function') { openDeitySkillInfo(); log('deitySkillModal'); }
    else if (modal === 'deity' && typeof openDeityPicker === 'function') { openDeityPicker(); log('deityModal'); }
    else if (modal === 'skillincrease' && typeof growthPickSkillIncrease === 'function') { growthPickSkillIncrease(parseInt(Q.get('siLevel')||lvl)||3); log('skillIncModal'); }
    else if (modal === 'skilltrain' && typeof growthPickSkillTraining === 'function') { growthPickSkillTraining(parseInt(Q.get('siSlot')||0)); log('skillTrainModal'); }
    else if (modal === 'sanct' && typeof openSanctPicker === 'function') { openSanctPicker(); log('sanctModal'); }
    else if (modal === 'font' && typeof openDivineFontPicker === 'function') { openDivineFontPicker(); log('fontModal'); }
    else if (modal === 'doctrine' && typeof openDoctrinePicker === 'function') { openDoctrinePicker(); log('doctrineModal'); }
    else if (modal === 'bonus' && typeof openBonusSpellsModal === 'function') { openBonusSpellsModal(); log('bonusModal'); }
    // ?pick=N : 선택 피커에서 N번 옵션 미리보기(설명 펼침) 트리거
    var _pk = Q.get('pick');
    if (_pk != null && typeof _previewChoice === 'function') {
      var _rows = document.querySelectorAll('.choice-row');
      var _n = parseInt(_pk) || 0;
      if (_rows[_n]) _previewChoice(_n, _rows[_n]);
    }

    // 검증용: ?expandgcf=1 이면 클래스특성 아코디언 전부 펼침
    if (Q.get('expandgcf')) {
      document.querySelectorAll('.gcf-body').forEach(function(b){ b.classList.add('gcf-open'); });
      document.querySelectorAll('.gcf-main').forEach(function(h){ h.classList.add('gcf-head-open'); });
    }
    document.title = 'READY';
  } catch(e){ log('ERR:'+e.message); document.title = 'ERR:'+e.message; console.error(e); }
})();
</script>
</body></html>
