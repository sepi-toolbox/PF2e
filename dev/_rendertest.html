<script>
  // ── Firebase/네트워크 스텁 (렌더 하니스: 실제 저장/인증 없이 UI만) ──
  window.firebase = { firestore: function(){ var f=function(){return f;}; f.collection=f; f.doc=f; f.get=function(){return Promise.resolve({exists:false});}; f.FieldValue={serverTimestamp:function(){return 0;},delete:function(){return 0;}}; f.Timestamp={now:function(){return {toMillis:function(){return 0;}};}}; return f; }, auth: function(){ return { onAuthStateChanged:function(){}, }; } };
  window.db = null; window.currentUser = null;
</script>

<!-- 모달 셸(index.html 복제) — ?modal=boost|skill 로 해당 모달 렌더 확인 -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header" id="modal-header-bar">
      <h2 id="modal-title" style="flex:1;">선택</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
      <button id="modal-close-m" class="modal-close-mobile" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="modal-list">
        <div class="modal-list-header">
          <input class="modal-search" id="modal-search" placeholder="검색..." oninput="filterOptions()">
          <div class="modal-filters" id="modal-filterbar"></div>
        </div>
        <div class="modal-list-items" id="modal-options"></div>
      </div>
      <div class="modal-detail" id="modal-detail">
        <div class="modal-detail-empty">항목을 선택하면 상세 정보가 표시됩니다.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal()">닫기</button>
      <button class="btn btn-confirm" onclick="confirmModal()">선택</button>
    </div>
  </div>
</div>

<!-- 지식(Lore) 섹션·모달 — index.html 복제(하니스에서 renderLores/모달 검증용) -->
<div style="max-width:380px;padding:8px;"><span style="color:#ddd;font:13px sans-serif;">지식 Lore</span><div id="lore-list"></div></div>
<div class="modal-overlay hidden" id="lore-modal"><div class="modal"><div class="modal-header"><h2 style="flex:1;">지식 Lore</h2></div><div class="modal-body" style="display:block;"><input id="lore-add-name"><div id="lore-modal-list"></div><div id="lore-modal-empty"></div></div></div></div>

<div id="boot-status" style="color:#fff;font:12px monospace;padding:8px;"></div>
<script>
(async function(){
  var log = function(m){ var el=document.getElementById('boot-status'); if(el) el.textContent += m+' | '; };
  try {
    // 1) index.html의 <style> 런타임 주입(동일 CSS)
    var htmlTxt = await (await fetch('index.html')).text();
    var m, re = /<style[^>]*>([\s\S]*?)<\/style>/g, css='';
    while ((m = re.exec(htmlTxt))) css += m[1] + '\n';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    log('css:'+css.length);

    // 2) 카탈로그 로드
    if (typeof _ensureAllCatalogs === 'function') { await _ensureAllCatalogs(); log('catalogs'); }

    // ══ 2b) 인터랙션 흐름 검증 러너 (?flow=class-build) ══════════════════════════
    //   state를 미리 심지 않고 실제 함수 체인(모달 열기→확정→빌더 선택)을 순차 구동한 뒤,
    //   각 단계 결과를 자동 검증(assert)해 #assert-out(JSON)+document.title(PASS/FAIL)로 출력.
    //   tools/verifyflow.sh가 --dump-dom으로 이 결과를 뽑아 스크립트로 pass/fail 판정.
    var FLOW = new URLSearchParams(location.search).get('flow');
    if (FLOW) {
      await runFlow(FLOW, new URLSearchParams(location.search));
      return;  // 흐름 모드는 이 브랜치에서 완결(아래 렌더 로직 건너뜀)
    }

    // 3) 목 state (URL 파라미터: ?class=cleric&level=1)
    var Q = new URLSearchParams(location.search);
    var clsId = Q.get('class') || 'cleric';
    var lvl = Q.get('level') || '1';
    var lvEl = document.getElementById('level'); if (lvEl) lvEl.value = lvl;
    var lvEl2 = document.getElementById('f-level'); if (lvEl2) lvEl2.value = lvl;
    if (typeof PF2eClass !== 'undefined' && PF2eClass.getClassLegacy) state.selectedClass = PF2eClass.getClassLegacy(clsId);
    if (typeof PF2eAnc !== 'undefined') { try { state.selectedAncestry = PF2eAnc.getAncestryLegacy(Q.get('ancestry') || 'human'); if (state.selectedAncestry) state.vision = state.selectedAncestry.vision || 'none'; } catch(e){} }
    if (typeof PF2eBg !== 'undefined') { try {
      var _bg = PF2eBg.getBackgroundLegacy('acolyte') || PF2eBg.getBackgroundLegacy('acrobat');
      if (!_bg) { var bgs = PF2eBg.backgroundList ? PF2eBg.backgroundList() : (PF2eBg.list ? PF2eBg.list() : []); _bg = (bgs && bgs.length) ? bgs[0] : null; }
      if (_bg) state.selectedBackground = _bg;
    } catch(e){ log('bgErr:'+e.message); } }
    // 신격: 목록에서 성별화 2택 + 폰트 있는 것 하나
    try {
      var dl = (typeof _allDeities === 'function') ? _allDeities() : (typeof PF2eDeity !== 'undefined' && PF2eDeity.list ? PF2eDeity.list() : []);
      var pick = dl.find(function(d){ return (d.sanctification||[]).length>=1 && (d.font||[]).length; }) || dl[0];
      if (pick) state.deity = pick.id;
    } catch(e){ log('deityErr'); }
    state.trainableSkillSlots = (state.selectedClass && state.selectedClass.free_skill_count) || 2;
    state.growth = state.growth || {};
    // 채워진 박스 확인용: 교리/성별화/신성원천도 세팅(있으면)
    try {
      var _cid = state.selectedClass && state.selectedClass.id;
      var _docs = (typeof SUBCLASS_DB !== 'undefined' && _cid) ? SUBCLASS_DB.filter(function(s){return s.class_id===_cid;}) : [];
      var _subQ = Q.get('sub');   // ?sub=doctrine-warpriest 로 서브클래스 지정, ?sub=none 이면 미선택
      if (_subQ === 'none') { state.selectedSubclass = null; }
      else if (_subQ) { state.selectedSubclass = _docs.find(function(s){return s.id===_subQ;}) || _docs[0]; }
      else if (_docs.length) state.selectedSubclass = _docs[0];
      var _dd = state.deity && typeof _getDeity==='function' ? _getDeity(state.deity) : null;
      if (_dd) { if ((_dd.sanctification||[]).length) state.sanctification = _dd.sanctification[0]; if ((_dd.font||[]).length) state.divineFont = _dd.font[0]; }
    } catch(e){}
    log('cls:'+(state.selectedClass?state.selectedClass.id:'none')+' deity:'+state.deity);

    // 3a) 기술 훈련 미리선택(검증용): ?trainpick=acrobatics,arcana
    var _tp = Q.get('trainpick');
    if (_tp) { state.growth[1] = state.growth[1] || {}; state.growth[1].skillTraining = _tp.split(','); }
    // 3a') 기술 증가 모달 검증용: ?modal=skillincrease&siLevel=N&siPick=athletics (해당 레벨 증가 사전선택 → 재오픈 하이라이트 확인)
    if (Q.get('modal') === 'skillincrease') {
      var _siLv = parseInt(Q.get('siLevel') || lvl) || 3;
      var _siPick = Q.get('siPick');
      if (_siPick) { state.growth[_siLv] = state.growth[_siLv] || {}; state.growth[_siLv].skillIncrease = _siPick; }
      // ?siSeed=3:religion;5:athletics — 관문 검증용, 다른 레벨의 기술 증가를 미리 심음(예: 3레벨에 전문가로 만들어 5레벨 후보 제외 확인)
      var _siSeed = Q.get('siSeed');
      if (_siSeed) { _siSeed.split(';').forEach(function(p){ var kv=p.split(':'); var L=parseInt(kv[0]); if(L&&kv[1]){ state.growth[L]=state.growth[L]||{}; state.growth[L].skillIncrease=kv[1]; } }); }
    }

    // 3b) 기술 숙련 DOM(sk-prof-*) 주입 — 기술 모달이 참조. recalcAll이 훈련값 기록.
    if (typeof SKILLS !== 'undefined') {
      var skHost = document.createElement('div'); skHost.style.display = 'none';
      skHost.innerHTML = SKILLS.map(function(s){ return '<select id="sk-prof-'+s.id+'"><option value="0"></option><option value="2"></option><option value="4"></option><option value="6"></option><option value="8"></option></select><span id="sk-val-'+s.id+'"></span>'; }).join('');
      document.body.appendChild(skHost);
    }

    // 3c) 스펠 탭(?panel=spells) — index.html의 panel-spells 주입 + 클레릭 주문 상태 + renderSpells
    if (Q.get('panel') === 'spells') {
      var _pi = htmlTxt.indexOf('<div id="panel-spells"');
      var _pe = htmlTxt.indexOf('id="panel-pets"');
      if (_pi >= 0 && _pe > _pi) {
        var _slice = htmlTxt.slice(_pi, htmlTxt.lastIndexOf('<', _pe));  // panel-spells ~ 직전
        document.getElementById('spell-panel-host').innerHTML = _slice;
        var _ps = document.getElementById('panel-spells'); if (_ps) { _ps.classList.add('active'); _ps.style.display = 'block'; }
        // 스펠 탭만 보이게 성장 플랜 숨김
        var _gp = document.getElementById('growth-plan'); if (_gp) _gp.style.display = 'none';
        var _gpm = document.getElementById('growth-plan-mobile'); if (_gpm) _gpm.style.display = 'none';
      }
      // 클레릭 주문 상태(목: 레벨1 준비형 + 신성 원천 해악)
      state.spellSlots = state.spellSlots || {}; state.spellSlots[1] = 2;
      state.cantripSlots = 5;
      state.preparedSpells = state.preparedSpells || { cantrip: [], 1: [] };
      state.divineFont = Q.get('font') || 'harm';
      state.divineFontUsed = 0;
      state.spells = state.spells || { cantrip: [], known: [], focus: [], innate: [] };
    }

    // 3d) 능력치 증강 시드(검증용): ?boostSeed=ancFixed:str;bg:str;cls:str;lv1:str;lv5:str (부분증강 ½ 확인 등)
    var _bs = Q.get('boostSeed');
    if (_bs) { _bs.split(';').forEach(function(p){ var kv=p.split(':'); var k=kv[0], v=kv[1]; if(!k||!v) return; if(k==='cls'){ state.boosts.cls=v; } else { state.boosts[k]=state.boosts[k]||[]; state.boosts[k].push(v); } }); }

    // 4) 유효성 판정 + 렌더
    if (typeof _resolveChoiceValidity === 'function') _resolveChoiceValidity();
    try { if (typeof recalcAll === 'function') recalcAll(); log('recalc'); } catch(e){ log('recalcErr:'+e.message); }
    if (typeof renderGrowthPlan === 'function') renderGrowthPlan();
    if (Q.get('panel') === 'spells') {
      // 실제 #panel-spells DOM을 index.html에서 추출해 주입(renderSpells가 참조하는 요소 전부 제공).
      try {
        var _psS = htmlTxt.indexOf('<div id="panel-spells"');
        var _psMark = '/#panel-spells -->';
        var _psE = htmlTxt.indexOf(_psMark);
        if (_psS >= 0 && _psE > _psS) {
          var _host = document.createElement('div');
          _host.innerHTML = htmlTxt.slice(_psS, _psE + _psMark.length);
          document.body.appendChild(_host);
          log('spellPanelDOM');
        }
      } catch(e){ log('panelInjErr:'+e.message); }
      // 자동 부여 특성/주문(집중 주문 등) 적용 후 렌더.
      try { if (typeof applyClassFeatures === 'function') applyClassFeatures(); } catch(e){ log('acfErr:'+e.message); }
      try { if (typeof recalcAll === 'function') recalcAll(); } catch(e){}
      try { if (typeof renderSpells === 'function') renderSpells(); log('spells'); } catch(e){ log('spellsErr:'+e.message); console.error(e); }
      try { if (typeof switchSpellSubtab === 'function') switchSpellSubtab(Q.get('sub') || 'class'); } catch(e){ log('subErr:'+e.message); }
      // 슬롯 준비 트리거 검증: ?prepslot=R:I → openPrepareSpellForSlot(R,I) (memorize 모달)
      var _ps = Q.get('prepslot');
      if (_ps && typeof openPrepareSpellForSlot === 'function') {
        var _pp = _ps.split(':'); try { openPrepareSpellForSlot(parseInt(_pp[0])||0, parseInt(_pp[1])||0); log('prepslot'); } catch(e){ log('prepErr:'+e.message); }
      }
      // 주문 배우기/기억 모달 직접 열기: ?openmem=1
      if (Q.get('openmem') && typeof openMemorizeModal === 'function') { try { openMemorizeModal(); log('memOpen'); } catch(e){ log('memErr:'+e.message); } }
      // 주문 상세 HTML 직접 렌더 검증: ?spelldetail=<slug> (주사위 버튼·메타·출처)
      var _sd = Q.get('spelldetail');
      if (_sd && typeof _learnSpellDetailHtml === 'function' && typeof getSpell === 'function') {
        try {
          var _sp = getSpell(_sd);
          var _box = document.createElement('div');
          _box.style.cssText = 'max-width:640px;margin:12px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;';
          _box.innerHTML = _sp ? _learnSpellDetailHtml(_sp) : ('주문 없음: '+_sd);
          document.body.insertBefore(_box, document.body.firstChild);
          log('spellDetail:'+(_sp?_sp.id:'null'));
        } catch(e){ log('sdErr:'+e.message); }
      }
    }
    log('rendered');

    // 5) 모달 렌더(옵션): ?modal=boost | skill
    var modal = Q.get('modal');
    if (modal === 'boost' && typeof openBoostModal === 'function') { openBoostModal(parseInt(Q.get('boostLv')||0)||undefined); log('boostModal'); }
    else if (modal === 'skill' && typeof growthPickSkillTrainingMulti === 'function') { growthPickSkillTrainingMulti(); log('skillModal'); }
    else if (modal === 'deityskill' && typeof openDeitySkillInfo === 'function') { openDeitySkillInfo(); log('deitySkillModal'); }
    else if (modal === 'deity' && typeof openDeityPicker === 'function') { openDeityPicker(); log('deityModal'); }
    else if (modal === 'class' && typeof _buildClassChoicesUI === 'function') {
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('modal-title').textContent = '클래스 선택';
      var _searchEl2 = document.getElementById('modal-search'); if (_searchEl2) _searchEl2.style.display = 'none';
      var _opt2 = document.getElementById('modal-options'); if (_opt2) _opt2.innerHTML = _buildClassChoicesUI(state.selectedClass);
      var _det = document.getElementById('modal-detail'); if (_det) _det.innerHTML = '';
      log('classModal');
    }
    else if (modal === 'ancestry' && typeof showItemDetail === 'function' && typeof PF2eAnc !== 'undefined') {
      // openModal이 modalType='ancestry'를 세팅(cs_data의 let modalType는 window 할당 불가) → showItemDetail 분기 활성화.
      if (typeof openModal === 'function') openModal('ancestry');
      var _ancId = Q.get('anc') || 'elf';
      var _ancObj = PF2eAnc.getAncestryLegacy(_ancId);
      var _mb = document.getElementById('modal-body'); if (_mb) _mb.classList.add('detail-open');
      var _det2 = document.getElementById('modal-detail'); if (_det2) _det2.style.display = '';
      if (_ancObj) showItemDetail(_ancObj);
      log('ancestryDetail:'+(_ancObj?_ancObj.id:'null'));
    }
    else if (modal === 'classdetail' && typeof showItemDetail === 'function' && typeof PF2eClass !== 'undefined') {
      if (typeof openModal === 'function') openModal('class');
      var _cdId = Q.get('class') || 'witch';
      var _cdObj = PF2eClass.getClassLegacy(_cdId);
      var _cmb = document.getElementById('modal-body'); if (_cmb) _cmb.classList.add('detail-open');
      var _cdet = document.getElementById('modal-detail'); if (_cdet) _cdet.style.display = '';
      if (_cdObj) showItemDetail(_cdObj);
      log('classDetail:'+(_cdObj?_cdObj.id:'null'));
    }
    else if (modal === 'bgdetail' && typeof showItemDetail === 'function' && typeof PF2eBg !== 'undefined') {
      if (typeof openModal === 'function') openModal('background');
      var _bgId = Q.get('bg') || 'guard';
      var _bgObj = PF2eBg.getBackgroundLegacy(_bgId);
      var _bmb = document.getElementById('modal-body'); if (_bmb) _bmb.classList.add('detail-open');
      var _bdet = document.getElementById('modal-detail'); if (_bdet) _bdet.style.display = '';
      if (_bgObj) showItemDetail(_bgObj);
      log('bgDetail:'+(_bgObj?_bgObj.id:'null'));
    }
    else if (modal === 'skillincrease' && typeof growthPickSkillIncrease === 'function') { growthPickSkillIncrease(parseInt(Q.get('siLevel')||lvl)||3); log('skillIncModal'); }
    else if (modal === 'skilltrain' && typeof growthPickSkillTraining === 'function') { growthPickSkillTraining(parseInt(Q.get('siSlot')||0)); log('skillTrainModal'); }
    else if (modal === 'sanct' && typeof openSanctPicker === 'function') { openSanctPicker(); log('sanctModal'); }
    else if (modal === 'font' && typeof openDivineFontPicker === 'function') { openDivineFontPicker(); log('fontModal'); }
    else if (modal === 'doctrine' && typeof openDoctrinePicker === 'function') { openDoctrinePicker(); log('doctrineModal'); }
    else if (modal === 'bonus' && typeof openBonusSpellsModal === 'function') { openBonusSpellsModal(); log('bonusModal'); }
    // ?modal=featlist&featType=class : 재주 선택 모달 목록 렌더(행동비용 글리프 검증용, #4)
    else if (modal === 'featlist' && typeof growthPickFeat === 'function') { growthPickFeat(parseInt(Q.get('featLevel')||lvl)||1, 'class1', Q.get('featType')||'class'); log('featListModal'); }
    // ?modal=mobilepick&mt=class|ancestry|background&optid=<이름조각> : 모바일 폭에서 목록 클릭→아코디언 상세 구동(#5 검증)
    else if (modal === 'mobilepick' && typeof openModal === 'function') {
      var _mt = Q.get('mt') || 'class';
      openModal(_mt);
      var _mpTries = 0;
      (function _mpClick() {
        var _rows = document.querySelectorAll('#modal-options .opt-row');
        if (!_rows.length && _mpTries++ < 30) { setTimeout(_mpClick, 100); return; }
        if (window.__mpDone) return; window.__mpDone = 1;
        var _optid = Q.get('optid'), _idx = 0;
        if (_optid) { for (var i = 0; i < _rows.length; i++) { if ((_rows[i].textContent || '').indexOf(_optid) >= 0) { _idx = i; break; } } }
        var _row = _rows[_idx];
        // 아이템 객체를 legacy 게터로 얻어 selectOption을 정확히 1회 직접 호출(.click() 이중 토글 회피)
        var _getr = { class: (window.PF2eClass && PF2eClass.getClassLegacy), ancestry: (window.PF2eAnc && PF2eAnc.getAncestryLegacy), background: (window.PF2eBg && PF2eBg.getBackgroundLegacy) }[_mt];
        var _id = (_mt === 'class') ? (Q.get('class') || 'fighter') : (Q.get('optidval') || _optid);
        var _item = _getr ? _getr(_id) : null;
        if (_item && _row && typeof selectOption === 'function') selectOption(_item, _row);
        else if (_row) _row.click();
        log('mobilePick:' + (_row ? (_row.textContent || 'x').slice(0, 10) : 'norow') + '|open=' + document.querySelectorAll('.opt-row-detail.open').length);
      })();
    }
    // ?panel=weapons : 무기 탭 개편 검증 — 패널 주입 + 무기 2개 시드 + renderWeapons
    if (Q.get('panel') === 'weapons') {
      try {
        var _wMark = '/#panel-weapons -->';
        var _wS = htmlTxt.indexOf('<div id="panel-weapons"');

// 인터랙션 흐름 검증 러너 — 실제 함수 체인을 순차 구동하고 단계별 결과를 자동 검증한다.

//   출력: #assert-out(JSON, 스크립트 판정용) + 화면 요약 + document.title="PASS n/n"|"FAIL n/n"

async function runFlow(flow, Q){

    if (typeof SKILLS !== 'undefined') {
      var skHost = document.createElement('div'); skHost.style.display='none';
      skHost.innerHTML = SKILLS.map(function(s){ return '<select id="sk-prof-'+s.id+'"><option value="0"></option><option value="2"></option><option value="4"></option><option value="6"></option><option value="8"></option></select><span id="sk-val-'+s.id+'"></span>'; }).join('');

    }
    // 선행 전제: 혈통/배경(실 캐릭터가 갖는 상태) — 클래스 확정만 흐름으로 검증
    try { if (typeof PF2eAnc !== 'undefined') state.selectedAncestry = PF2eAnc.getAncestryLegacy('human'); } catch(e){}
    try { if (typeof PF2eBg !== 'undefined') { var _bg = PF2eBg.getBackgroundLegacy('acolyte'); if(!_bg){ var bgs=PF2eBg.backgroundList?PF2eBg.backgroundList():[]; _bg=bgs&&bgs[0]; } if(_bg) state.selectedBackground=_bg; } } catch(e){}

      assert('1.feat-modal-opened', modalType === 'feat', 'modalType='+modalType);
      var _feat = PF2eFeat.getFeatLegacy(fSlug);
      assert('2.feat-in-catalog', !!_feat, fSlug+' → '+(_feat?(_feat.name_en||_feat.name_ko):'null'));
      if (_feat) {
        modalSelected = _feat; confirmModal();
        var _fName = (_feat.name_ko||'') + (_feat.name_en ? (' ('+_feat.name_en+')') : '');
        var _picked = (state.feats[fType]||[]).some(function(f){ return featSlug(f)===featSlug(_fName) || featSlug(f)===fSlug; });
        assert('2.feat-committed', _picked, 'feats.'+fType+'='+JSON.stringify((state.feats[fType]||[]).map(function(f){ return f.name||f; })));
        assert('2.feat-in-growth-slot', !!((state.growth[fLv]||{})[fKey]), 'growth['+fLv+']['+fKey+']='+((state.growth[fLv]||{})[fKey]));
        renderGrowthPlan();
        assert('3.feat-persists', (state.feats[fType]||[]).length>0 && !!((state.growth[fLv]||{})[fKey]), 'ok');
      }

    } else if (flow === 'deity-derive') {
      // 신격 파생: 신격 미사용 클래스(파이터)엔 신격 필드 없음 → 신격 사용 재주(도메인 입문자) 추가 시 파생 노출.
      commitClass('fighter'); setLevel(1);
      assert('1.class-committed', state.selectedClass && state.selectedClass.id === 'fighter', 'cls='+(state.selectedClass&&state.selectedClass.id));
      assert('2.no-deity-initial', typeof _buildUsesDeity === 'function' && _buildUsesDeity() === false, '_buildUsesDeity='+(typeof _buildUsesDeity==='function'?_buildUsesDeity():'undef'));
      renderGrowthPlan();
      assert('3.no-deity-field', gp().indexOf('신격 Deity') < 0, '초기 성장플랜에 신격 필드 없어야');
      var _df = PF2eFeat.getFeatLegacy('domain-initiate');
      assert('4.deity-feat-in-catalog', !!_df, 'domain-initiate → '+(_df?(_df.name_en||_df.name_ko):'null'));
      if (_df) {
        state.feats.archetype = state.feats.archetype || [];
        state.feats.archetype.push({ name: (_df.name_ko||'')+' ('+(_df.name_en||'')+')', slug: 'domain-initiate', level: 1 });
        assert('5.uses-deity-after', _buildUsesDeity() === true, '재주 추가 후 _buildUsesDeity='+_buildUsesDeity());
        renderGrowthPlan();
        assert('6.deity-field-appears', gp().indexOf('신격 Deity') >= 0, '신격 사용 재주 추가 후 신격 필드 파생돼야');
      }

    } else if (flow === 'default-build') {
      // 완전 빈 캐릭터 → 기본 빌드(Human/Fighter/Warrior) 자동 적용, 아무것도 미선택 상태 방지
      state.selectedClass = null; state.selectedAncestry = null; state.selectedBackground = null; state.selectedHeritage = null;
      assert('0.pre-all-empty', !state.selectedClass && !state.selectedAncestry && !state.selectedBackground, 'ok');
      var _ret = applyDefaultBuild();
      assert('1.applied', _ret === true, 'applyDefaultBuild='+_ret);
      assert('2.ancestry-set', state.selectedAncestry && state.selectedAncestry.id === 'human', 'ancestry='+(state.selectedAncestry&&state.selectedAncestry.id));
      assert('2.class-set', state.selectedClass && state.selectedClass.id === 'fighter', 'class='+(state.selectedClass&&state.selectedClass.id));
      assert('2.background-set', state.selectedBackground && state.selectedBackground.id === 'warrior', 'background='+(state.selectedBackground&&state.selectedBackground.id));
      assert('3.class-defaults', (state.trainableSkillSlots||0) > 0, 'trainableSkillSlots='+state.trainableSkillSlots);
      recalcAll();
      var _hp = parseInt((document.getElementById('hp-max')||{}).value||'0');
      assert('3.hp-derived', _hp > 0, 'hp-max='+_hp+' (혈통+클래스 HP 파생)');
      assert('3.background-grants', (state._bgGrantedSkills||[]).length > 0, '_bgGrantedSkills='+JSON.stringify(state._bgGrantedSkills||[]));
      renderGrowthPlan();
      // 재적용 방지(멱등): 이미 채워졌으면 no-op
      assert('4.idempotent', applyDefaultBuild() === false, '두 번째 호출은 false여야');

    } else if (flow === 'lore-build') {
      // R3: 엘프 지식 재주 → '엘프 지식' 부여 지식 자동 수집·렌더. R2: 커스텀 지식 add/remove·렌더.
      commitClass('wizard'); setLevel(1);
      // 엘프 지식 재주 부여(성장 빌더 없이 직접 state에 주입)
      state.feats = state.feats || {}; state.feats.ancestry = state.feats.ancestry || [];
      state.feats.ancestry.push({ id: 'elven-lore', name: '엘프 지식 (Elven Lore)', level: 1 });
      recalcAll();
      var _src = (state._loreSources || []).map(function(s){ return s.name; });
      assert('R3.granted-collected', _src.indexOf('엘프 지식') >= 0, '_loreSources=' + JSON.stringify(_src));
      var _ll = function(){ return (document.getElementById('lore-list')||{}).innerHTML || ''; };
      assert('R3.granted-rendered', _ll().indexOf('엘프 지식') >= 0 && _ll().indexOf('부여') >= 0, '지식 목록에 엘프 지식+부여 배지');
      // R1 확인: 엘프 지식 효과에 skill_defaults choice 없음(픽커 제거)
      var _eff = (typeof EFFECTS_DB !== 'undefined') ? EFFECTS_DB['elven-lore'] : null;
      assert('R1.no-picker', _eff && !_eff.choice, 'elven-lore.choice=' + (_eff && JSON.stringify(_eff.choice)));
      // R2: 커스텀 지식 추가
      document.getElementById('lore-add-name').value = '검술 지식';
      addCustomLore();
      assert('R2.custom-added', (state.customLores||[]).some(function(l){return l.name==='검술 지식';}), 'customLores=' + JSON.stringify(state.customLores));
      assert('R2.custom-trained2', ((state.customLores||[])[0]||{}).rank === 2, 'rank=' + ((state.customLores||[])[0]||{}).rank);
      assert('R2.custom-rendered', _ll().indexOf('검술 지식') >= 0, '지식 목록에 검술 지식');
      // 기본 빈 지식(lore1/lore2 유령) 없음 — 모든 지식은 이름을 가짐(빈 슬롯 폐지)
      var _allLore = (state._loreSources||[]).map(function(s){return s.name;}).concat((state.customLores||[]).map(function(l){return l.name;}));
      assert('R2.no-empty-slots', _allLore.length > 0 && _allLore.every(function(n){return (n||'').trim();}), '전 지식 명명됨(빈 슬롯 없음): ' + JSON.stringify(_allLore));
      // R2: 커스텀 삭제
      removeCustomLore(0);
      assert('R2.custom-removed', !(state.customLores||[]).some(function(l){return l.name==='검술 지식';}), 'customLores=' + JSON.stringify(state.customLores));
      assert('R2.granted-persists', (state._loreSources||[]).map(function(s){return s.name;}).indexOf('엘프 지식') >= 0, '부여 지식은 삭제 후에도 유지');

    } else if (flow === 'class-skill') {
      // 택1 클래스 스킬(파이터 곡예/운동) — 데이터 파싱·게이지·선택 적용 검증.
      commitClass('fighter'); setLevel(1);
      var _grp = (state.selectedClass && state.selectedClass.choice_skill_groups) || [];
      assert('1.data-parsed', _grp.length === 1 && _grp[0].indexOf('acrobatics') >= 0 && _grp[0].indexOf('athletics') >= 0, 'choice_skill_groups=' + JSON.stringify(_grp));
      renderGrowthPlan();
      var _gp = function(){ return (document.getElementById('growth-plan')||{}).innerHTML || ''; };
      assert('2.gauge-rendered', _gp().indexOf('클래스 스킬') >= 0, '빌더에 「클래스 스킬」 게이지');
      // 선택 시뮬레이션(피커 onSelect가 하는 일): athletics 선택
      state.classSkillChoices = state.classSkillChoices || [];
      state.classSkillChoices[0] = 'athletics';
      recalcAll();
      var _rank = parseInt((document.getElementById('sk-prof-athletics')||{}).value || '0');
      assert('3.skill-trained', _rank >= 2, 'sk-prof-athletics=' + _rank + ' (택1 클래스 스킬 훈련)');
      // 그룹 밖 값은 무시(운동만 유효) — 잘못된 값 주입 시 미적용
      state.classSkillChoices[0] = 'stealth';   // 파이터 그룹(곡예/운동) 밖
      recalcAll();
      var _rankBad = parseInt((document.getElementById('sk-prof-stealth')||{}).value || '0');
      assert('4.invalid-ignored', _rankBad < 2, 'sk-prof-stealth=' + _rankBad + ' (그룹 밖 값 미적용)');
      // 재렌더 후에도 게이지 유지 + athletics 복원
      state.classSkillChoices[0] = 'athletics'; recalcAll(); renderGrowthPlan();
      assert('5.persists', _gp().indexOf('클래스 스킬') >= 0 && parseInt((document.getElementById('sk-prof-athletics')||{}).value||'0') >= 2, 'ok');

    } else {
      assert('unknown-flow', false, 'flow='+flow);
    }
  } catch(e){ assert('EXCEPTION', false, e.message + ' @ ' + ((e.stack||'').split('\n')[1]||'')); }

  // ── 결과 출력 ──
  var pass = A.filter(function(a){return a.pass;}).length, total = A.length;
  var el = document.createElement('div'); el.id = 'assert-out';
  el.textContent = JSON.stringify({flow:flow, pass:pass, total:total, ok:(pass===total&&total>0), asserts:A});
  el.style.cssText = 'position:absolute;left:-9999px;';  // 화면 밖(dump-dom 파싱 전용)
  document.body.appendChild(el);
  var sum = document.createElement('div'); sum.style.cssText='font:13px monospace;padding:10px;color:#ddd;line-height:1.6;';
  sum.innerHTML = '<b>'+(pass===total&&total>0?'PASS':'FAIL')+' '+pass+'/'+total+'</b> — '+flow+'<hr style="border-color:#333">'+
    A.map(function(a){ return (a.pass?'<span style="color:#6c6">✔</span>':'<span style="color:#e66">✘</span>')+' '+a.name+(a.detail?' <span style="color:#999">('+a.detail.replace(/</g,'&lt;')+')</span>':''); }).join('<br>');
  document.body.appendChild(sum);
  document.title = (pass===total&&total>0 ? 'PASS ' : 'FAIL ') + pass + '/' + total;
}
</script>
</body></html>
