<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pathforge Builder (FVTT)</title>
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
<link rel="stylesheet" href="pf2e.css" />
<link rel="stylesheet" href="builder.css" />
</head>
<body>
  <!-- FVTT 외곽 DOM 재현: .actor.sheet.character > .window-content (pf2e.css 셀렉터 충족) -->
  <div class="builder-app application sheet pf2e actor character">
    <section class="window-content">
      <div id="sheet-root"></div>
    </section>
  </div>

  <!-- 모바일 하단 네비 (≤768px에서만 표시) -->
  <nav class="mobile-nav" aria-label="mobile navigation">
    <button data-toggle="sidebar" aria-label="방어"><i class="fa-solid fa-shield-halved"></i><span>방어</span></button>
    <button data-tab="character" class="active" aria-label="캐릭터"><i class="fa-solid fa-address-card"></i><span>캐릭터</span></button>
    <button data-tab="actions" aria-label="액션"><span class="action-glyph">1</span><span>액션</span></button>
    <button data-tab="inventory" aria-label="인벤토리"><i class="fa-solid fa-backpack"></i><span>인벤토리</span></button>
    <button data-tab="spellcasting" aria-label="주문"><i class="fa-solid fa-wand-magic-sparkles"></i><span>주문</span></button>
    <button data-tab="crafting" aria-label="제작"><i class="fa-solid fa-hammer"></i><span>제작</span></button>
    <button data-tab="proficiencies" aria-label="전문성"><i class="fa-solid fa-hand"></i><span>전문성</span></button>
    <button data-tab="feats" aria-label="재주"><i class="fa-solid fa-medal"></i><span>재주</span></button>
    <button data-tab="effects" aria-label="효과"><i class="fa-solid fa-person-rays"></i><span>효과</span></button>
    <button data-tab="biography" aria-label="일대기"><i class="fa-solid fa-book-reader"></i><span>일대기</span></button>
  </nav>

  <!-- 데이터층 + RE 엔진 (FVTT-Native 레이어, ../ 공유 모듈) -->
  <script>window.PF2eDataConfig = { dataRoot: "../data" };</script>
  <script src="../cs_pf2e.js"></script>
  <script src="../cs_re_engine.js"></script>
  <script src="../cs_pf2e_stats.js"></script>
  <script src="../class_features_db.js"></script>
  <script src="../cs_pf2e_actor.js"></script>

  <script src="vendor/handlebars.min.js"></script>
  <script src="hbs_helpers.js"></script>
  <script src="context_adapter.js"></script>
  <script>
  (async function () {
    try {
      const tmpl = await window.BuilderHbs.loadTemplates();
      // 빌더에 필요한 BASE 카테고리 선로드 (get() 동기 접근 가능해짐)
      if (window.PF2eData) {
        await Promise.all(["classes", "ancestries", "backgrounds", "heritages", "deities"]
          .map((c) => window.PF2eData.loadCategory(c).catch((e) => console.warn("데이터 로드 실패", c, e))));
      }
      const useSample = new URLSearchParams(location.search).has("sample");
      const state = useSample ? window.BuilderContext.sampleState() : undefined;
      const ctx = window.BuilderContext.buildContext(state);
      const root = document.getElementById("sheet-root");
      root.innerHTML = tmpl(ctx);
      wireInteractions(root);
      console.log("[builder] 렌더 완료", useSample ? "(샘플)" : "(빈 캐릭터)", ctx._derived ? "deriveStats✓" : "base폴백");
    } catch (e) {
      console.error("[builder] 렌더 실패:", e);
      document.getElementById("sheet-root").innerHTML =
        '<pre style="color:#fff;padding:1rem;white-space:pre-wrap">렌더 오류: ' + (e && e.stack || e) + "</pre>";
    }
  })();

  function wireInteractions(root) {
    const form = root.querySelector("form.crb-style");
    if (!form) return;
    function switchTab(tab) {
      form.querySelectorAll("nav.sheet-navigation .item").forEach((a) =>
        a.classList.toggle("active", a.dataset.tab === tab));
      form.querySelectorAll(".sheet-content > .tab").forEach((s) =>
        s.classList.toggle("active", s.dataset.tab === tab));
      document.querySelectorAll(".mobile-nav button[data-tab]").forEach((b) =>
        b.classList.toggle("active", b.dataset.tab === tab));
      form.classList.remove("show-sidebar");
    }
    form.querySelectorAll("nav.sheet-navigation .item[data-tab]").forEach((a) =>
      a.addEventListener("click", () => switchTab(a.dataset.tab)));
    document.querySelectorAll(".mobile-nav button").forEach((b) =>
      b.addEventListener("click", () => {
        if (b.dataset.toggle === "sidebar") form.classList.toggle("show-sidebar");
        else if (b.dataset.tab) switchTab(b.dataset.tab);
      }));
    form.addEventListener("click", (e) => {
      if (form.classList.contains("show-sidebar") && !e.target.closest("aside") &&
          !e.target.closest(".mobile-nav")) form.classList.remove("show-sidebar");
    });
    switchTab("character");
  }
  </script>
</body>
</html>
