<style>
/* FVTT 양피지 테마 — CharacterSheet.html과 통일 */
:root{
  --bg:#ece1c7;--bg2:#e4d6b5;--bg3:#d9c8a2;--bg4:#ccb78c;
  --card:#e7d8b6;--border:#bfa572;--border2:#a3884e;
  --text:#2b2117;--text2:#574021;
  --accent:#6e1414;--accent-bg:#f3e7cd;
  --gold:#8a6a1f;--blue:#2f5d7a;--red:#8a1a1a;--green:#3f7a3f;
  --bs:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
@font-face{font-family:"Eczar";font-weight:600;font-display:swap;src:url("fonts/eczar-v16-latin-ext_latin-600.woff2") format("woff2");}
@font-face{font-family:"Eczar";font-weight:700;font-display:swap;src:url("fonts/eczar-v16-latin-ext_latin-700.woff2") format("woff2");}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;color:var(--text);font-family:var(--bs);font-size:13px;min-height:100vh;}
/* 헤더(.app-header) + 기어 메뉴(#gear-menu) = app-shell.css(공유, <head>에서 link). 여기서 따로 정의하지 않음. */
#main{max-width:720px;margin:0 auto;padding:24px 16px;}
.section{margin-bottom:32px;}
.section h2{color:var(--accent);font-family:"Eczar",var(--bs);font-size:17px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:6px;letter-spacing:.5px;}
#login-prompt{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--text2);}
/* 세션 카드 = 양피지 박스 */
.session-card{background:linear-gradient(180deg,rgba(255,250,238,.55),rgba(231,216,184,.55)),var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,box-shadow .2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
.session-card:hover{border-color:var(--accent);}
.session-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),inset 0 0 0 1px rgba(255,255,255,.35);}
.sc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.sc-name{font-weight:700;font-size:14px;color:var(--text);}
.sc-code{font-family:monospace;letter-spacing:2px;color:var(--accent);font-size:13px;}
.sc-meta{color:var(--text2);font-size:11px;}
/* 플레이어 카드 */
.player-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.player-card .name{font-weight:700;font-size:13px;color:var(--text);}
.player-card .info{color:var(--text2);font-size:11px;}
.kick-btn{background:var(--red);color:#fff;border:1px solid var(--red);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;flex-shrink:0;transition:filter .12s;}
/* 버튼 — 양피지 테마 시맨틱 색 */
.btn{border:1px solid;padding:8px 18px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:700;transition:filter .12s,background .12s,border-color .12s;font-family:var(--bs);}
.btn-gold{background:#6e1414 url("data/fvtt-assets/sheet/red_bg.webp") repeat;border-color:#7a1d1d;color:#f3e7cd;}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;}
.btn-gray{background:var(--bg3);border-color:var(--border2);color:var(--text2);}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-green{background:var(--green);border-color:var(--green);color:#fff;}
.btn-google{background:#fff;border-color:#dadce0;color:#3c4043;font-weight:700;}
.btn-small{padding:4px 12px;font-size:11px;}
.btn:hover,.kick-btn:hover,#auth-area button:hover{filter:brightness(1.08);}
/* 입력 */
.input{width:100%;padding:9px;background:var(--accent-bg);border:1px solid var(--border2);color:var(--text);border-radius:5px;font-size:14px;}
/* 모달 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(35,24,12,0.55);z-index:999;display:flex;align-items:center;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal-box{background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border:1px solid var(--border2);border-radius:10px;padding:24px;min-width:300px;max-width:90vw;color:var(--text);}
/* empty */
.empty{color:var(--text2);font-size:13px;text-align:center;padding:20px;}
/* 주사위 토스트 — CharacterSheet.html과 동일 */
#dice-toast-container{position:fixed;top:12px;right:12px;z-index:99999;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-height:60vh;overflow:hidden;}
.dice-toast{pointer-events:auto;min-width:180px;max-width:260px;background:#1e1e1e;border:1px solid #444;border-left:3px solid #3498db;border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);}
.dice-toast.show{transform:translateX(0);opacity:1;}
.dice-toast.hide{transform:translateX(120%);opacity:0;}
.dice-toast.nat20{border-color:#f1c40f;box-shadow:0 0 20px rgba(241,196,15,.4);}
.dice-toast.nat1{border-color:#e74c3c;box-shadow:0 0 20px rgba(231,76,60,.3);}
.dice-toast-who{font-size:10px;font-weight:700;color:#3498db;margin-bottom:2px;}
.dice-toast-header{display:flex;justify-content:space-between;align-items:center;}
.dice-toast-label{font-size:11px;color:#999;font-weight:600;}
.dice-toast-total{font-size:22px;font-weight:900;color:#3498db;}
.dice-toast.nat20 .dice-toast-total{color:#f1c40f;}
.dice-toast.nat1 .dice-toast-total{color:#e74c3c;}
.dice-toast-detail{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.dice-result-chip{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;}
.dice-result-chip.dice-max{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
.dice-result-chip.dice-min{opacity:.6;}
@media(max-width:900px){
  #dice-toast-container{top:8px;right:8px;left:8px;}
  .dice-toast{max-width:none;}
}
</style>

<body>

<!-- 헤더 = 플레이어/로비 헤더와 완전 동일 구조 (.app-header: 브랜드 + 우측 ⚙) -->
<div id="top-bar" class="app-header">
  <span class="app-brand">Pathforge - GM (dev)</span>
  <div style="flex:1;"></div>
  <div class="hdr-actions">
    <button class="hdr-gear-btn" onclick="toggleGearMenu(event)" title="계정 · 모드 선택" aria-label="설정">⚙</button>
  </div>
</div>

<!-- 설정/계정 팝업 (톱니바퀴) — 플레이어 시트와 동일 패턴 -->
<div id="gear-menu" onclick="event.stopPropagation()">
  <div class="gear-sec-head">범용</div>
  <div id="auth-area"><button class="btn btn-google" onclick="googleLogin()">Google 로그인</button></div>
  <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="(window.top||window).location.href='./'">🔁 모드 선택으로</button>
</div>

<div id="login-prompt">
  <p style="color:#666;">우측 상단 ⚙ 메뉴에서 Google 로그인을 해주세요.</p>
</div>

<div id="main" style="display:none;">
  <!-- 세션 목록 -->
  <div class="section">
    <h2>내 세션 <button class="btn btn-gold btn-small" onclick="openCreateModal()" style="float:right;">+ 새 세션</button></h2>
    <div id="session-list"><p class="empty">로딩 중...</p></div>
  </div>

  <!-- 선택된 세션 상세 -->
  <div id="session-detail" style="display:none;" class="section">
    <h2 id="detail-title">세션 상세</h2>
    <div id="detail-code" style="margin-bottom:12px;"></div>
    <div id="detail-players"></div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-red btn-small" onclick="deleteCurrentSession()">세션 삭제</button>
    </div>
  </div>
</div>

<!-- 세션 만들기 모달 -->
<div id="create-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 style="color:var(--gold);margin-bottom:16px;">새 세션 만들기</h3>
    <input id="new-session-name" class="input" type="text" placeholder="세션 이름 (예: 멸망의 시대)" maxlength="30">
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button class="btn btn-gray" onclick="closeCreateModal()">취소</button>
      <button class="btn btn-gold" onclick="doCreateSession()">만들기</button>
    </div>
  </div>
</div>


<script>
// ═══════════════════════════════════════════════
//  상태
// ═══════════════════════════════════════════════
const PF2E_OWNER_UID = 'D11melTRb6VFObMbKvkP4t3Flgv2';  // GM 도구 소유자(bsg9072@gmail.com). 실제 잠금은 firestore.rules.
let currentUser = null;
let mySessions = [];       // [{id, name, joinCode, gmUid, players, createdAt}]
let selectedSessionId = null;
let _sessionsUnsub = null; // onSnapshot

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode() {
  let c = '';
  for (let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}

// ═══════════════════════════════════════════════
//  Auth
// ═══════════════════════════════════════════════
let _loginPending = false;
function googleLogin() {
  if (_loginPending) return;
  _loginPending = true;
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
    if (e.code !== 'auth/cancelled-popup-request' && e.code !== 'auth/popup-closed-by-user')
      alert('로그인 실패: ' + e.message);
  }).finally(() => { _loginPending = false; });
}

// 기어 메뉴 토글 — 플레이어 시트와 동일 동작
function toggleGearMenu(ev) {
  if (ev) ev.stopPropagation();
  const m = document.getElementById('gear-menu');
  const g = document.querySelector('.hdr-gear-btn');
  if (!m) return;
  const open = m.classList.toggle('open');
  if (g) g.classList.toggle('open', open);
}
function closeGearMenu() {
  const m = document.getElementById('gear-menu');
  const g = document.querySelector('.hdr-gear-btn');
  if (m) m.classList.remove('open');
  if (g) g.classList.remove('open');
}
document.addEventListener('click', function(e) {
  const m = document.getElementById('gear-menu');
  if (!m || !m.classList.contains('open')) return;
  if (e.target.closest && (e.target.closest('#gear-menu') || e.target.closest('.hdr-gear-btn'))) return;
  closeGearMenu();
});

auth.onAuthStateChanged(user => {
  currentUser = user;
  const area = document.getElementById('auth-area');
  const main = document.getElementById('main');
  const prompt = document.getElementById('login-prompt');
  if (user) {
    area.innerHTML = '<span class="auth-user">' + (user.displayName || user.email) + '</span>' +
      '<button class="btn btn-ghost" onclick="auth.signOut()">로그아웃</button>';
    // GM 도구는 소유자 전용 — 비소유자는 차단(진짜 잠금은 firestore.rules). UX 차원 게이트.
    if (user.uid !== PF2E_OWNER_UID) {
      prompt.innerHTML = '<p style="color:#888;">🔒 GM 도구는 소유자 전용입니다.</p>';
      prompt.style.display = 'flex';
      main.style.display = 'none';
      stopListening();
      mySessions = [];
      selectedSessionId = null;
      return;
    }
    prompt.style.display = 'none';
    main.style.display = '';
    startListening();
  } else {
    area.innerHTML = '<button class="btn btn-google" onclick="googleLogin()">Google 로그인</button>';
    prompt.style.display = 'flex';
    main.style.display = 'none';
    stopListening();
    mySessions = [];
    selectedSessionId = null;
  }
});

// ═══════════════════════════════════════════════
//  세션 목록 실시간 감시
// ═══════════════════════════════════════════════
function startListening() {
  if (!currentUser) return;
  _sessionsUnsub = db.collection(PF_COL.sessions)
    .where('gmUid', '==', currentUser.uid)
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      mySessions = [];
      snap.forEach(doc => {
        mySessions.push({ id: doc.id, ...doc.data() });
      });
      renderSessionList();
      // 선택된 세션이 아직 있으면 상세도 갱신
      if (selectedSessionId) {
        const s = mySessions.find(s => s.id === selectedSessionId);
        if (s) renderSessionDetail(s);
        else { selectedSessionId = null; document.getElementById('session-detail').style.display = 'none'; }
      }
    }, err => {
      console.error('[sessions listen]', err);
      // index 없으면 폴백 (orderBy 없이)
      if (err.code === 'failed-precondition') {
        _sessionsUnsub = null;
        startListeningFallback();
      }
    });
}

function startListeningFallback() {
  _sessionsUnsub = db.collection(PF_COL.sessions)
    .where('gmUid', '==', currentUser.uid)
    .onSnapshot(snap => {
      mySessions = [];
      snap.forEach(doc => { mySessions.push({ id: doc.id, ...doc.data() }); });
      renderSessionList();
      if (selectedSessionId) {
        const s = mySessions.find(s => s.id === selectedSessionId);
        if (s) renderSessionDetail(s);
      }
    });
}

function stopListening() {
  if (_sessionsUnsub) { _sessionsUnsub(); _sessionsUnsub = null; }
  stopRollsListener();
}

// ═══════════════════════════════════════════════
//  세션 목록 렌더링
// ═══════════════════════════════════════════════
function renderSessionList() {
  const el = document.getElementById('session-list');
  if (!mySessions.length) {
    el.innerHTML = '<p class="empty">세션이 없습니다. 새 세션을 만들어보세요.</p>';
    return;
  }
  el.innerHTML = mySessions.map(s => {
    const pc = Object.keys(s.players || {}).length;
    const active = s.id === selectedSessionId ? ' active' : '';
    return '<div class="session-card' + active + '" onclick="selectSession(\'' + s.id + '\')">' +
      '<div class="sc-header"><span class="sc-name">' + (s.name || '이름 없음') + '</span><span class="sc-code">' + s.joinCode + '</span></div>' +
      '<div class="sc-meta">참가자 ' + pc + '명</div>' +
    '</div>';
  }).join('');
}

// ═══════════════════════════════════════════════
//  세션 상세
// ═══════════════════════════════════════════════
function selectSession(id) {
  selectedSessionId = id;
  const s = mySessions.find(s => s.id === id);
  if (!s) return;
  renderSessionList(); // active 표시 갱신
  renderSessionDetail(s);
  startRollsListener(id); // 주사위 공유 리스너
}

function renderSessionDetail(s) {
  const detail = document.getElementById('session-detail');
  detail.style.display = '';
  document.getElementById('detail-title').textContent = s.name || '세션';
  document.getElementById('detail-code').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">' +
      '<div>참가 코드: <strong style="font-family:monospace;font-size:20px;letter-spacing:3px;color:var(--gold);">' + s.joinCode + '</strong>' +
      ' <button class="btn btn-gray btn-small" onclick="navigator.clipboard.writeText(\'' + s.joinCode + '\').then(()=>alert(\'복사됨!\'))">복사</button></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn btn-gold" onclick="startSession()">GM 모드로 보기 →</button>' +
        '<button class="btn btn-blue" onclick="startSessionAsPlayer()">플레이어 모드로 보기 →</button>' +
        '<button class="btn btn-green" onclick="startGMSheets()">🎭 시트 관리 →</button>' +
      '</div>' +
    '</div>';

  const players = s.players || {};
  const uids = Object.keys(players);
  if (!uids.length) {
    document.getElementById('detail-players').innerHTML = '<p class="empty">아직 참가한 플레이어가 없습니다.</p>';
    return;
  }
  // 플레이어 카드 렌더링 후 캐릭터 정보 비동기 로드
  document.getElementById('detail-players').innerHTML = uids.map(uid => {
    const p = players[uid];
    return '<div class="player-card">' +
      '<div><span class="name">' + (p.displayName || '???') + '</span><br><span class="info" id="pc-info-' + uid + '">로딩...</span></div>' +
      '<button class="kick-btn" onclick="kickPlayer(\'' + s.id + '\',\'' + uid + '\',\'' + (p.displayName || '???').replace(/'/g, "\\'") + '\')">추방</button>' +
    '</div>';
  }).join('');
  // 캐릭터 요약 로드 (개인 슬롯에서)
  uids.forEach(uid => {
    const slotId = players[uid]?.slotId;
    if (!slotId) { const el2 = document.getElementById('pc-info-' + uid); if (el2) el2.textContent = '슬롯 미지정'; return; }
    db.collection('users').doc(uid).collection(PF_COL.characters).doc(slotId).get().then(doc => {
      const el = document.getElementById('pc-info-' + uid);
      if (!el) return;
      if (doc.exists && doc.data().data) {
        try {
          const d = JSON.parse(doc.data().data);
          el.textContent = (d.name || '이름 없음') + ' — ' + (d.selectedClass || '?') + ' Lv.' + (d.level || 1);
        } catch(e) { el.textContent = '데이터 오류'; }
      } else {
        el.textContent = '빈 슬롯';
      }
    });
  });
}

// ═══════════════════════════════════════════════
//  세션 생성
// ═══════════════════════════════════════════════
function openCreateModal() {
  document.getElementById('create-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('new-session-name').focus(), 100);
}
function closeCreateModal() {
  document.getElementById('create-modal').classList.add('hidden');
  document.getElementById('new-session-name').value = '';
}

async function doCreateSession() {
  if (!currentUser) return;
  const name = document.getElementById('new-session-name').value.trim() || '새 세션';
  const code = genCode();
  // 충돌 검사
  const dup = await db.collection(PF_COL.sessions).where('joinCode', '==', code).get();
  if (!dup.empty) return doCreateSession();

  await db.collection(PF_COL.sessions).add({
    gmUid: currentUser.uid,
    joinCode: code,
    name: name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    players: {}
  });
  closeCreateModal();
  // onSnapshot이 자동으로 목록 갱신
}

// ═══════════════════════════════════════════════
//  세션 삭제
// ═══════════════════════════════════════════════
async function deleteCurrentSession() {
  if (!selectedSessionId) return;
  const s = mySessions.find(s => s.id === selectedSessionId);
  if (!s) return;
  if (!confirm('"' + (s.name||'세션') + '"을 삭제하시겠습니까?')) return;
  try {
    // rolls 서브컬렉션 삭제
    const rollSnap = await db.collection(PF_COL.sessions).doc(selectedSessionId).collection('rolls').get();
    const batch = db.batch();
    rollSnap.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection(PF_COL.sessions).doc(selectedSessionId));
    await batch.commit();
    // 플레이어 캐릭터의 sessionId는 각 클라이언트의 onSnapshot에서 자동 정리됨
  } catch(e) {
    console.error('[deleteSession]', e);
    alert('삭제 실패: ' + e.message);
  }
  selectedSessionId = null;
  document.getElementById('session-detail').style.display = 'none';
}

// ═══════════════════════════════════════════════
//  참가자 추방
// ═══════════════════════════════════════════════
async function kickPlayer(sessionId, uid, name) {
  if (!confirm('"' + name + '"을(를) 세션에서 추방하시겠습니까?\n캐릭터는 해당 플레이어의 개인 슬롯에 그대로 유지됩니다.')) return;
  try {
    // 세션 doc에서 해당 플레이어의 slotId 확인 후 sessionId 제거
    const sessDoc = await db.collection(PF_COL.sessions).doc(sessionId).get();
    if (sessDoc.exists) {
      const slotId = sessDoc.data().players?.[uid]?.slotId;
      if (slotId) {
        await db.collection('users').doc(uid)
          .collection(PF_COL.characters).doc(slotId).update({
            sessionId: firebase.firestore.FieldValue.delete()
          });
      }
    }
    // 세션 players map에서 제거
    const playerField = 'players.' + uid;
    await db.collection(PF_COL.sessions).doc(sessionId).update({
      [playerField]: firebase.firestore.FieldValue.delete()
    });
  } catch(e) {
    console.error('[kickPlayer]', e);
    alert('추방 실패: ' + e.message);
  }
}

// ═══════════════════════════════════════════════
//  세션 시작 → CharacterSheet.html?gmsession=ID
// ═══════════════════════════════════════════════
// 지도는 캐릭터 시트와 독립된 Map.html로 직행 (_cb: HTML 캐시버스터)
// 임베드(iframe)일 수 있으므로 항상 최상위 창을 이동시킨다
var _topNav = function(url) { (window.top || window).location.href = url; };
function startSession() {
  if (!selectedSessionId) { alert('세션을 선택하세요.'); return; }
  _topNav('Map.html?session=' + selectedSessionId + '&role=gm&_cb=' + Date.now());
}
function startSessionAsPlayer() {
  if (!selectedSessionId) { alert('세션을 선택하세요.'); return; }
  _topNav('Map.html?session=' + selectedSessionId + '&role=player&_cb=' + Date.now());
}
// GM 시트 관리 → CharacterSheet.html?gmsession=ID (플레이어 시트 탭 전환·편집). _cb: HTML 캐시버스터
function startGMSheets() {
  if (!selectedSessionId) { alert('세션을 선택하세요.'); return; }
  _topNav('./?gmsession=' + selectedSessionId + '&_cb=' + Date.now());
}

// ═══════════════════════════════════════════════
//  주사위 공유 토스트 (로비에서도 플레이어 굴림 확인)
// ═══════════════════════════════════════════════
const DICE_COLORS = {4:'#e74c3c',6:'#e67e22',8:'#f1c40f',10:'#2ecc71',12:'#3498db',20:'#9b59b6',100:'#95a5a6'};
let _rollsUnsub = null;
let _rollsReady = false;

function startRollsListener(sessionId) {
  stopRollsListener();
  _rollsReady = false;
  _rollsUnsub = db.collection(PF_COL.sessions).doc(sessionId)
    .collection('rolls')
    .limit(100)
    .onSnapshot(function(snap) {
      if (!_rollsReady) { _rollsReady = true; return; }
      snap.docChanges().forEach(function(change) {
        if (change.type === 'added') {
          var data = change.doc.data();
          if (currentUser && data.uid !== currentUser.uid) {
            showRemoteToast(data);
          }
        }
      });
    });
}

function stopRollsListener() {
  if (_rollsUnsub) { _rollsUnsub(); _rollsUnsub = null; }
  _rollsReady = false;
}

function showRemoteToast(data) {
  var container = document.getElementById('dice-toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'dice-toast-container';
    document.body.appendChild(container);
  }
  var toast = document.createElement('div');
  toast.className = 'dice-toast' + (data.isNat20 ? ' nat20' : '') + (data.isNat1 ? ' nat1' : '');

  var diceStr = (data.dice || []).map(function(d) {
    var cls = d.value === d.sides ? 'dice-max' : d.value === 1 ? 'dice-min' : '';
    return '<span class="dice-result-chip ' + cls + '" style="background:' + (DICE_COLORS[d.sides]||'#666') + '">d' + d.sides + ':' + d.value + '</span>';
  }).join(' ');

  var mod = data.modifier || 0;
  var modStr = mod ? ' ' + (mod >= 0 ? '+' : '') + mod : '';

  toast.innerHTML =
    '<div class="dice-toast-who">🎲 ' + (data.characterName || '???') + '</div>' +
    '<div class="dice-toast-header"><span class="dice-toast-label">' + (data.label || '') + '</span><span class="dice-toast-total">' + data.total + '</span></div>' +
    '<div class="dice-toast-detail">' + diceStr + modStr + '</div>';

  container.prepend(toast);
  requestAnimationFrame(function() { toast.classList.add('show'); });
  setTimeout(function() {
    toast.classList.remove('show');
    toast.classList.add('hide');
    setTimeout(function() { toast.remove(); }, 400);
  }, 5000);
}
