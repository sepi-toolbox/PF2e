<style>
:root{
  --bg:#1c1c1c; --bg2:#222; --bg3:#2a2a2a; --bg4:#333; --text:#ddd; --text2:#999;
  --border:#444; --border2:#555; --accent:#c9a84c; --gold:#c9a84c;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0c0c0c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}

/* 상단 바 (지도 전용 — 캐릭터 시트와 독립) */
#map-topbar{
  position:fixed;top:0;left:0;right:0;height:44px;z-index:20;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:#161616;border-bottom:1px solid var(--border);
}
#map-topbar .mt-back{
  background:var(--bg4);color:var(--text);border:1px solid var(--border);
  border-radius:5px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
}
#map-topbar .mt-back:hover{background:var(--accent);color:#1a1a1a;}
#map-topbar .mt-title{color:var(--accent);font-weight:700;font-size:14px;}
#map-topbar .mt-role{color:var(--text2);font-size:12px;margin-left:auto;}

/* 지도 영역 (상단 바 아래 전체) — 높이는 cs_map.js _resize가 px로 지정 */
#map-stage{
  position:fixed;top:44px;left:0;right:0;bottom:0;
  background:#0c0c0c;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
#map-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#map-empty{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:var(--text2);font-size:13px;text-align:center;padding:24px;line-height:1.6;pointer-events:none;
}
#map-toolbar{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:6;}
#map-toolbar button{
  background:rgba(20,20,20,.82);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;
}
#map-toolbar button:hover{background:rgba(42,42,42,.95);color:var(--accent);}
#map-toolbar button:disabled{opacity:.6;cursor:default;}
#map-toolbar button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700;}
#map-zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:5;}
#map-zoom button{
  width:38px;height:38px;font-size:18px;line-height:1;
  background:rgba(20,20,20,.82);color:var(--text);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;
}
#map-zoom button:active{background:var(--bg4);}

/* ── 안개 공개/제거 확장 메뉴 (툴바 오른쪽 플라이아웃) ── */
.fog-menu{position:absolute;top:8px;left:104px;z-index:6;display:flex;flex-direction:column;gap:5px;
  background:rgba(16,16,16,.92);border:1px solid var(--border);border-radius:8px;padding:6px;}
.fog-menu button{background:rgba(40,40,40,.95);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;text-align:left;white-space:nowrap;}
.fog-menu button:hover{color:var(--accent);}
.fog-menu button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700;}

/* ── 지도 편집기 (드로어 ✎) ── */
#map-map-editor{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:16;
  background:rgba(20,20,22,.97);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;width:min(330px,92%);box-shadow:0 8px 28px rgba(0,0,0,.6);}
#map-map-editor .mme-title{color:var(--accent);font-weight:700;font-size:13px;margin-bottom:10px;}
#map-map-editor .mme-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;color:var(--text2);}
#map-map-editor .mme-row label{min-width:34px;}
#map-map-editor input[type=text]{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px;font-size:13px;}
#map-map-editor input[type=range]{flex:1;accent-color:var(--accent);}
#map-map-editor button{background:rgba(45,45,48,.95);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;}
#map-map-editor button:hover{color:var(--accent);}
#map-map-editor .mme-check{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer;}
#map-map-editor b{color:var(--accent);font-size:12px;min-width:34px;text-align:right;}
#map-map-editor .mme-status{font-size:11px;color:var(--text2);}
#map-map-editor .mme-actions{justify-content:flex-end;margin-bottom:0;margin-top:2px;}

/* ── GM 멀티맵 좌측 드로어 ── */
#map-drawer{
  position:fixed;top:44px;left:0;bottom:0;width:232px;z-index:15;
  background:#141414;border-right:1px solid var(--border);
  display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .18s ease;
}
#map-drawer.open{transform:translateX(0);box-shadow:4px 0 18px rgba(0,0,0,.5);}
#map-drawer .md-head{padding:10px 12px;font-size:12px;font-weight:700;color:var(--accent);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
#map-drawer .md-head .md-x{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;line-height:1;}
#map-drawer .md-head .md-x:hover{color:var(--accent);}
#map-drawer .md-tabs{display:flex;border-bottom:1px solid var(--border);flex:0 0 auto;}
#map-drawer .md-tab{flex:1;background:none;border:none;color:var(--text2);font-size:12px;font-weight:700;
  padding:9px 0;cursor:pointer;border-bottom:2px solid transparent;}
#map-drawer .md-tab:hover{color:var(--text);}
#map-drawer .md-tab.on{color:var(--accent);border-bottom-color:var(--accent);}
#map-drawer .md-panel{display:flex;flex-direction:column;}
#map-drawer .md-hint{padding:8px 12px 2px;font-size:11px;color:var(--text2);line-height:1.5;}
#map-drawer .md-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#map-drawer .md-sect-h{padding:9px 12px 3px;font-size:11px;font-weight:700;color:var(--text2);}
#map-drawer .md-sect-h .md-sect-hint{font-weight:400;color:var(--border2);}
#map-drawer .md-list{padding:0 6px;}
#map-drawer .tp-list{padding:0 6px;}
#map-drawer .tp-empty{padding:8px 10px;font-size:11px;color:var(--text2);line-height:1.5;}
#map-drawer .tp-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:4px;border-radius:6px;
  background:var(--bg3);border:1px solid var(--border);cursor:grab;touch-action:none;}
#map-drawer .tp-row:hover{border-color:var(--accent);}
#map-drawer .tp-row:active{cursor:grabbing;}
#map-drawer .tp-thumb{width:30px;height:30px;border-radius:50%;flex:0 0 auto;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1a1a1a;border:1px solid var(--border2);}
#map-drawer .tp-name{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#map-drawer .db-panel .md-db-search{margin:8px 8px 6px;padding:6px 8px;background:var(--bg3);color:var(--text);
  border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;}
#map-drawer .db-panel .md-db-search:focus{border-color:var(--accent);}
#map-drawer .md-db-list{flex:1;}
#map-drawer .db-row{cursor:grab;}
#map-drawer .db-row .db-lv{color:var(--text2);font-size:10px;font-weight:400;}
#map-drawer .md-db-more{padding:6px 12px 12px;font-size:10px;color:var(--border2);text-align:center;}
#map-drawer .tp-act{background:rgba(40,40,40,.9);color:var(--text2);border:1px solid var(--border);border-radius:5px;
  width:26px;height:28px;font-size:11px;cursor:pointer;flex:0 0 auto;}
#map-drawer .tp-act:hover{color:var(--accent);}
#map-drawer .tp-act.tp-del:hover{color:#e07070;border-color:#5a2a2a;}
.tpl-ghost{position:fixed;z-index:9999;transform:translate(-50%,-50%);pointer-events:none;
  background:rgba(201,168,76,.92);color:#1a1a1a;font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);white-space:nowrap;}
#map-drawer .md-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;border-radius:6px;padding:2px;}
#map-drawer .md-row.active{background:rgba(201,168,76,.16);outline:1px solid rgba(201,168,76,.5);}
#map-drawer .md-name{flex:1;text-align:left;background:var(--bg3);color:var(--text);border:1px solid var(--border);
  border-radius:5px;padding:7px 9px;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#map-drawer .md-row.active .md-name{color:var(--accent);font-weight:700;}
#map-drawer .md-name:hover{border-color:var(--accent);}
#map-drawer .md-act{background:rgba(40,40,40,.9);color:var(--text2);border:1px solid var(--border);
  border-radius:5px;width:28px;height:30px;font-size:12px;cursor:pointer;}
#map-drawer .md-act:hover{color:var(--accent);}
#map-drawer .md-act.md-del:hover{color:#e07070;border-color:#5a2a2a;}
#map-drawer .md-add{margin:6px;padding:9px;background:var(--bg4);color:var(--text);border:1px dashed var(--border2);
  border-radius:6px;font-size:12px;cursor:pointer;}
#map-drawer .md-add:hover{color:var(--accent);border-color:var(--accent);}

/* ── GM NPC 편집기 ── */
#map-npc-editor{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;
  background:rgba(20,20,22,.97);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;width:min(300px,88%);box-shadow:0 8px 28px rgba(0,0,0,.6);
}
#map-npc-editor .ne-title{color:var(--accent);font-weight:700;font-size:13px;margin-bottom:10px;}
#map-npc-editor .ne-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--text2);}
#map-npc-editor .ne-row label{min-width:34px;}
#map-npc-editor input[type=text]{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:6px 8px;font-size:13px;}
#map-npc-editor select{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:5px;font-size:13px;}
#map-npc-editor .ne-check{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer;}
#map-npc-editor .ne-actions{justify-content:flex-end;gap:8px;margin-bottom:0;margin-top:4px;}
#map-npc-editor .ne-actions button{background:rgba(40,40,40,.9);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;}
#map-npc-editor .ne-actions button:hover{color:var(--accent);}
#map-npc-editor .ne-actions .ne-del{color:#e07070;border-color:#5a2a2a;}
#map-npc-editor .ne-actions .ne-del:hover{background:#5a2a2a;color:#fff;}

/* ── 배치된 토큰 빠른 액션(숨기기/제거) ── */
#map-token-actions{position:absolute;z-index:16;display:flex;gap:5px;white-space:nowrap;
  background:rgba(20,20,22,.96);border:1px solid var(--border);border-radius:8px;padding:5px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);}
#map-token-actions button{background:rgba(45,45,48,.95);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;}
#map-token-actions button:hover{color:var(--accent);}
#map-token-actions #mta-del:hover{color:#e07070;border-color:#5a2a2a;}
#map-token-actions .mta-hp{display:flex;align-items:center;font-size:12px;font-weight:700;color:#e0b35c;padding:0 4px;}
#map-token-actions #mta-hp-amt{width:46px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 6px;font-size:12px;}
#map-token-actions #mta-dmg{color:#e07070;border-color:#5a2a2a;}
#map-token-actions #mta-dmg:hover{background:#5a2a2a;color:#fff;}
#map-token-actions #mta-heal{color:#7fc97f;border-color:#2a5a2a;}
#map-token-actions #mta-heal:hover{background:#2a5a2a;color:#fff;}

/* ── 몬스터 연결 (토큰 편집기) ── */
#map-npc-editor .ne-monster{align-items:flex-start;}
.ne-monster .ml-wrap{position:relative;flex:1;}
#ml-current{font-size:12px;color:#c9b896;margin-bottom:4px;}
#ml-current #ml-clear{background:none;border:1px solid var(--border);color:#e07070;border-radius:4px;font-size:10px;padding:1px 5px;cursor:pointer;margin-left:4px;}
#ml-search{width:100%;}
.ml-results{position:absolute;left:0;right:0;top:100%;z-index:50;max-height:240px;overflow-y:auto;background:#1b1814;border:1px solid var(--border);border-radius:8px;margin-top:3px;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.ml-item{padding:6px 9px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #2c2519;}
.ml-item:last-child{border-bottom:none;}
.ml-item:hover{background:#2c2519;}
.ml-item b{color:var(--text);} .ml-item i{color:#9a8f7a;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-item .ml-lv{color:#e0b35c;font-size:10px;font-weight:700;}
.ml-empty{padding:8px;color:#9a8f7a;font-size:12px;text-align:center;}
/* ── 스탯 팝오버 ── */
#ml-stat-overlay{position:fixed;inset:0;z-index:10010;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.55);padding:24px 12px;overflow-y:auto;}
#ml-stat-card{position:relative;max-width:760px;width:100%;margin:auto;}
#ml-stat-close{position:absolute;top:-12px;right:-8px;z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#221e18;color:var(--text);font-size:15px;cursor:pointer;}
#ml-stat-close:hover{color:var(--accent);}
/* ── 다이스 피드백 (cs_dice.js) ── */
#dice-toast-container{position:fixed;top:12px;right:12px;z-index:99999;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-height:60vh;overflow:hidden;}
.dice-toast{pointer-events:auto;min-width:180px;max-width:260px;background:#1e1e1e;border:1px solid #444;border-left:3px solid #3498db;border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);}
.dice-toast.show{transform:translateX(0);opacity:1;}
.dice-toast.hide{transform:translateX(120%);opacity:0;}
.dice-toast.nat20{border-color:#f1c40f;box-shadow:0 0 20px rgba(241,196,15,.4);}
.dice-toast.nat1{border-color:#e74c3c;box-shadow:0 0 20px rgba(231,76,60,.3);}
.dice-toast-header{display:flex;justify-content:space-between;align-items:center;}
.dice-toast-label{font-size:11px;color:#999;font-weight:600;}
.dice-toast-total{font-size:22px;font-weight:900;color:#3498db;}
.dice-toast.nat20 .dice-toast-total{color:#f1c40f;}
.dice-toast.nat1 .dice-toast-total{color:#e74c3c;}
.dice-toast-detail{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.dice-result-chip{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;}
.dice-result-chip.dice-max{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
.dice-result-chip.dice-min{opacity:.6;}
#dice-anim-overlay{position:fixed;inset:0;z-index:10020;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;}
#dice-anim-overlay.active{opacity:1;pointer-events:auto;}
#dice-anim-overlay.hidden{opacity:0;pointer-events:none;}
.dice-3d{width:64px;height:64px;position:relative;animation:diceRoll .8s cubic-bezier(.17,.67,.32,1.2) both;perspective:400px;}
.dice-3d-face{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;background:var(--color,#9b59b6);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.2);animation:diceSpin .7s cubic-bezier(.17,.67,.32,1.2) both;animation-delay:inherit;}
.dice-3d-label{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--color,#999);opacity:.7;}
@keyframes diceRoll{0%{transform:translateY(-80px) scale(0.3);opacity:0}40%{transform:translateY(10px) scale(1.1);opacity:1}60%{transform:translateY(-5px) scale(0.98)}100%{transform:translateY(0) scale(1)}}
@keyframes diceSpin{0%{transform:rotateX(720deg) rotateZ(360deg)}100%{transform:rotateX(0) rotateZ(0)}}
.dice-anim-total{position:absolute;bottom:24%;left:50%;transform:translateX(-50%);text-align:center;animation:totalPop .4s .6s both;}
.dice-anim-total-num{display:block;font-size:48px;font-weight:900;color:var(--accent,#d4a04a);text-shadow:0 2px 16px rgba(0,0,0,.6);}
.dice-anim-total.nat20 .dice-anim-total-num{color:#f1c40f;text-shadow:0 0 24px rgba(241,196,15,.6);}
.dice-anim-total.nat1 .dice-anim-total-num{color:#e74c3c;}
.dice-anim-total-label{font-size:12px;color:var(--text2,#999);}
@keyframes totalPop{0%{transform:translateX(-50%) scale(0);opacity:0}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1);opacity:1}}

</style>
</head>
<body>

<div id="map-topbar">
  <button class="mt-back" onclick="location.href='GMSheet.html'">← 로비</button>
  <span class="mt-title" id="map-title">세션</span>
  <span class="mt-role" id="map-role"></span>
</div>

<!-- GM 멀티맵 드로어 (좌측, 토글) -->
<div id="map-drawer">
  <div class="md-head"><span>드로어</span><button class="md-x" onclick="MapView.toggleDrawer()" title="닫기">✕</button></div>
  <div class="md-tabs">
    <button id="md-tab-maps" class="md-tab on" onclick="MapView.setDrawerTab('maps')">🗺 지도</button>
    <button id="md-tab-tokens" class="md-tab" onclick="MapView.setDrawerTab('tokens')">🎭 토큰</button>
    <button id="md-tab-creatures" class="md-tab" onclick="MapView.setDrawerTab('creatures')">🐉 크리처</button>
    <button id="md-tab-hazards" class="md-tab" onclick="MapView.setDrawerTab('hazards')">⚠ 해저드</button>
  </div>
  <div class="md-scroll" id="md-scroll">
    <div id="md-panel-maps" class="md-panel">
      <div class="md-list" id="map-drawer-list"></div>
      <button class="md-add" onclick="MapView.addMap()">＋ 새 지도</button>
    </div>
    <div id="md-panel-tokens" class="md-panel" style="display:none;">
      <div class="md-hint">토큰을 만들어 지도로 끌어다 놓으세요.</div>
      <div class="tp-list" id="map-tpl-list"></div>
      <button class="md-add" onclick="MapView.addTemplate()">＋ 토큰 추가</button>
    </div>
    <div id="md-panel-creatures" class="md-panel db-panel" style="display:none;">

<script>
// ── 지도 전용 글루 (캐릭터 시트와 독립) ──
let currentUser = null;
var state = { portrait: null };          // cs_map.js가 state.portrait 참조 (GM 뷰는 토큰 생성 안 함)
window._mapNoProvision = true;           // 독립 지도 = GM/미리보기 뷰 → 토큰 자동생성 안 함

const _params = new URLSearchParams(location.search);
const _sessionId = _params.get('session');
const _role = _params.get('role') || 'gm';
// GM '플레이어 모드로 보기'(role=player) = 플레이어 시점 안개 + 토큰은 전부 안개 위로(GM이 위치 확인)
window._mapTokensAboveFog = (_role === 'player');

auth.onAuthStateChanged(async function(user) {
  const emptyEl = document.getElementById('map-empty');
  if (!user) {
    emptyEl.style.display = 'flex';
    emptyEl.textContent = '로그인이 필요합니다. 로비(GMSheet)에서 로그인 후 다시 진입하세요.';
    return;
  }
  currentUser = user;
  if (!_sessionId) { alert('세션 ID가 없습니다.'); location.href = 'GMSheet.html'; return; }
  let data;
  try {
    const doc = await db.collection('sessions').doc(_sessionId).get();
    if (!doc.exists) { alert('세션을 찾을 수 없습니다.'); location.href = 'GMSheet.html'; return; }
    data = doc.data();
  } catch (e) { console.error('[Map session]', e); alert('세션 로드 실패: ' + e.message); location.href = 'GMSheet.html'; return; }

  document.getElementById('map-title').textContent = data.name || '세션';
  const isGM = (_role === 'gm');
  document.getElementById('map-role').textContent = isGM ? 'GM 시점' : '플레이어 시점';

  if (typeof MapSync !== 'undefined') MapSync.start(_sessionId, { isGM: isGM, uid: user.uid });
  if (typeof MapView !== 'undefined') { MapView.init(); MapView.show(); }
});
</script>

<!-- ── 몬스터 연결 글루: 토큰 ↔ MonsterDB (지연 로드 26MB, 검색·스탯 팝오버·굴림) ── -->
<script>
window.MonsterLink = (function () {
  'use strict';
  let _loaded = false, _loading = null, _sel = null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function ensure() {                              // 첫 사용 시에만 26MB 로드(지도 진입은 가볍게 유지)
    if (_loaded) return Promise.resolve();
    if (_loading) return _loading;
    if (typeof MonsterDB === 'undefined') return Promise.reject(new Error('MonsterDB 모듈 없음'));
    MonsterDB.injectStyles();
    _loading = MonsterDB.load({ dir: 'data/creatures/' }).then(() => { _loaded = true; })
      .catch(e => { _loading = null; throw e; });
    return _loading;
  }

  function _setLabel(text, linked) {
    const t = document.getElementById('ml-current-text'); if (t) t.textContent = text;
    const clr = document.getElementById('ml-clear'); if (clr) clr.style.display = linked ? '' : 'none';
  }
  function onEditOpen(id, t) {                     // 편집기 열릴 때 cs_map.js가 호출
    _sel = { monsterId: (t && t.monsterId) || null, monsterName: (t && t.monsterName) || null, hpMax: (t && t.hpMax) || 0 };
    _setLabel(_sel.monsterName ? ('🔗 ' + _sel.monsterName + (_sel.hpMax ? ' (HP ' + _sel.hpMax + ')' : '')) : '연결 안 됨', !!_sel.monsterId);
    const s = document.getElementById('ml-search'); if (s) s.value = '';
    const r = document.getElementById('ml-results'); if (r) { r.style.display = 'none'; r.innerHTML = ''; }
  }
  function getSelection() { return _sel; }         // npcApply가 저장 직전에 호출

  function onSearch(q) {
    const r = document.getElementById('ml-results'); if (!r) return;
    q = (q || '').trim();
    if (!q) { r.style.display = 'none'; r.innerHTML = ''; return; }
    r.innerHTML = '<div class="ml-empty">불러오는 중…</div>'; r.style.display = 'block';
    ensure().then(() => {
      const hits = MonsterDB.search(q).slice(0, 40);
      if (!hits.length) { r.innerHTML = '<div class="ml-empty">결과 없음</div>'; return; }
      r.innerHTML = hits.map(c => {
        const n = MonsterDB.name(c), lv = MonsterDB.level(c);
        return '<div class="ml-item" data-id="' + esc(c.id) + '" data-nm="' + esc(n.ko) +
               '"><b>' + esc(n.ko) + '</b> <i>' + esc(n.en) + '</i><span class="ml-lv">Lv ' + lv + '</span></div>';
      }).join('');
      r.querySelectorAll('.ml-item').forEach(el => el.onclick = () => pick(el.getAttribute('data-id'), el.getAttribute('data-nm')));
    }).catch(e => { r.innerHTML = '<div class="ml-empty">로드 실패: ' + esc(e.message) + '</div>'; });
  }

  function pick(id, nm) {
    let hpMax = 0;
    try {                                            // 연결 몬스터 기준 크기·HP 자동 + 이름 비어있으면 채움
      const c = MonsterDB.getCreature(id);
      if (c) {
        const SIZECAT = { tiny:'tiny', sm:'small', med:'medium', lg:'large', huge:'huge', grg:'gargantuan' };
        const tr = MonsterDB.traits(c), sizeSel = document.getElementById('np-size');
        if (sizeSel && tr.size && SIZECAT[tr.size]) sizeSel.value = SIZECAT[tr.size];
        const nameInp = document.getElementById('np-name');
        if (nameInp && !nameInp.value.trim()) nameInp.value = nm;
        hpMax = (MonsterDB.hp(c) || {}).max || 0;
      }
    } catch (e) {}
    _sel = { monsterId: id, monsterName: nm, hpMax: hpMax };
    const r = document.getElementById('ml-results'); if (r) { r.style.display = 'none'; r.innerHTML = ''; }
    const s = document.getElementById('ml-search'); if (s) s.value = '';
    _setLabel('🔗 ' + nm + (hpMax ? ' (HP ' + hpMax + ')' : ''), true);
    if (typeof MapView !== 'undefined' && MapView.npcApply) MapView.npcApply();   // monsterId+크기+이름+hpMax 저장
  }

  function clearLink() {
    _sel = { monsterId: null, monsterName: null, hpMax: 0 };
    _setLabel('연결 안 됨', false);
    if (typeof MapView !== 'undefined' && MapView.npcApply) MapView.npcApply();
  }

  function showStat(id) {                           // 배치 토큰 📋 → 스탯블록 팝오버 + 굴림
    ensure().then(() => {
      let ov = document.getElementById('ml-stat-overlay');
      if (!ov) {
        ov = document.createElement('div'); ov.id = 'ml-stat-overlay';
        ov.innerHTML = '<div id="ml-stat-card"><button id="ml-stat-close" title="닫기">✕</button><div id="ml-stat-body"></div></div>';
        document.body.appendChild(ov);
        ov.addEventListener('click', e => { if (e.target === ov) ov.style.display = 'none'; });
        ov.querySelector('#ml-stat-close').onclick = () => ov.style.display = 'none';
        MonsterDB.bindRolls(ov.querySelector('#ml-stat-body'));      // 위임 바인드 1회(재렌더 안전)
      }
      ov.querySelector('#ml-stat-body').innerHTML = MonsterDB.renderStatBlock(id);
      ov.style.display = 'flex';
    }).catch(e => alert('몬스터 데이터 로드 실패: ' + e.message));
  }

  return { ensure, onEditOpen, getSelection, onSearch, pick, clearLink, showStat };
})();
</script>
