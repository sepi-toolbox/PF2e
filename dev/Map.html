/* FVTT 양피지 테마 — Pathforge 본체와 통일 (지도 캔버스만 어둡게 유지) */
:root{
  --bg:#ece1c7; --bg2:#e4d6b5; --bg3:#d9c8a2; --bg4:#ccb78c; --text:#2b2117; --text2:#574021;
  --border:#bfa572; --border2:#a3884e; --accent:#6e1414; --gold:#8a6a1f; --cream:#f3e7cd;
  --bs:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
@font-face{font-family:"Eczar";font-weight:700;font-display:swap;src:url("fonts/eczar-v16-latin-ext_latin-700.woff2") format("woff2");}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0c0c0c;color:var(--text);font-family:var(--bs);overflow:hidden;}
/* 양피지 패널 공통 (지도 위 플로팅 = 본체 모달과 동일 언어) */
.pf-panel{background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border:1px solid var(--border2);box-shadow:0 8px 28px rgba(0,0,0,.45);}

/* 상단 바 = 공유 .app-header(배경/보더/색/flex는 app-shell.css). 여기선 지도용 고정 배치+높이만. */
#map-topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:44px;padding:0 16px;}
/* 기어 메뉴 버튼 기본형(.btn) — 색은 app-shell.css .btn-ghost/.btn-google, 레이아웃은 #gear-menu .btn */
.btn{border:1px solid var(--border2);background:var(--bg3);color:var(--text);border-radius:5px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{filter:brightness(1.06);}
/* 세션 준비중 상태바 — 헤더 아래 우상단, 버튼 아님(상태 표시 전용). 토글은 스페이스바. */
@keyframes pausePulse{0%,100%{opacity:1;}50%{opacity:.55;}}
#map-pause-status{position:fixed;top:52px;right:12px;z-index:8;font-size:12px;font-weight:700;letter-spacing:.5px;
  padding:5px 12px;border-radius:14px;cursor:default;user-select:none;white-space:nowrap;
  background:rgba(20,32,20,.62);color:#c7e6c1;border:1px solid rgba(120,170,120,.55);box-shadow:0 2px 8px rgba(0,0,0,.3);}
#map-pause-status.paused{background:rgba(94,0,0,.66);color:#ffd7d7;border-color:#ffb3b3;animation:pausePulse 1.4s ease-in-out infinite;}

/* 지도 영역 (상단 바 아래 전체) — 높이는 cs_map.js _resize가 px로 지정 */
#map-stage{
  position:fixed;top:44px;left:0;right:0;bottom:0;
  background:#0c0c0c;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
#map-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#map-empty{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:#b8a888;font-size:13px;text-align:center;padding:24px;line-height:1.6;pointer-events:none;
}
#map-toolbar{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:6;transition:left .18s ease;}
/* 드로어 열림 → 툴바/플라이아웃을 드로어 폭만큼 오른쪽으로 밀어냄 (가림 방지) */
#map-drawer.open ~ #map-stage #map-toolbar{left:240px;}
#map-drawer.open ~ #map-stage .fog-menu{left:290px;}
#map-toolbar button{
  background:rgba(236,225,199,.94);color:var(--text);border:1px solid var(--border2);
  border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);
}
/* 아이콘 전용 정사각 버튼 (툴바) */
#map-toolbar button.ic{width:38px;height:38px;padding:0;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;}
#map-toolbar button:hover{border-color:var(--accent);color:var(--accent);}
#map-toolbar button:disabled{opacity:.6;cursor:default;}
#map-toolbar button.on{background:#6e1414;color:var(--cream);border-color:#7a1d1d;font-weight:700;}
#map-zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:5;}
#map-zoom button{
  width:38px;height:38px;font-size:18px;line-height:1;
  background:rgba(236,225,199,.94);color:var(--text);border:1px solid var(--border2);
  border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);
}
#map-zoom button:active{background:var(--bg4);}

/* ── 안개 공개/제거 확장 메뉴 (툴바 오른쪽 플라이아웃) ── */
.fog-menu{position:absolute;top:8px;left:54px;z-index:6;display:flex;flex-direction:column;gap:5px;transition:left .18s ease;
  background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border:1px solid var(--border2);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.fog-menu button{background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;text-align:left;white-space:nowrap;}
/* 아이콘 전용 확장 메뉴 버튼 (정사각) */
.fog-menu.ic-menu button{width:36px;height:36px;padding:0;font-size:17px;text-align:center;display:flex;align-items:center;justify-content:center;}
/* 카메라 제어 메뉴 (텍스트 버튼 + 따라가기 체크박스) */
.fog-menu.cam-menu{min-width:132px;}
.fog-menu.cam-menu label{display:flex;align-items:center;gap:5px;width:100%;padding:6px 10px;font-size:12px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:6px;cursor:pointer;white-space:nowrap;}
.fog-menu.cam-menu label:hover{color:var(--accent);border-color:var(--accent);}
.fog-menu.cam-menu label input{margin:0;}
.fog-menu.cam-menu #mt-cctv.on{background:#6e1414;color:var(--cream);border-color:#7a1d1d;font-weight:700;}
.fog-menu button:hover{color:var(--accent);border-color:var(--accent);}
.fog-menu button.on{background:#6e1414;color:var(--cream);border-color:#7a1d1d;font-weight:700;}

/* ── 지도 편집기 (드로어 ✎) ── */
#map-map-editor{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:16;
  background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border:1px solid var(--border2);border-radius:10px;
  padding:12px 14px;width:min(330px,92%);box-shadow:0 8px 28px rgba(0,0,0,.55);}
#map-map-editor .mme-title{color:var(--accent);font-family:"Eczar",var(--bs);font-weight:700;font-size:14px;margin-bottom:10px;}
#map-map-editor .mme-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;color:var(--text2);}
#map-map-editor .mme-row label{min-width:34px;}
#map-map-editor input[type=text]{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px;font-size:13px;}
#map-map-editor input[type=range]{flex:1;accent-color:var(--accent);}
#map-map-editor button{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;}
#map-map-editor button:hover{color:var(--accent);border-color:var(--accent);}
#map-map-editor .mme-check{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer;}
#map-map-editor b{color:var(--accent);font-size:12px;min-width:34px;text-align:right;}
#map-map-editor .mme-status{font-size:11px;color:var(--text2);}
#map-map-editor .mme-hint{display:block;font-size:11px;color:var(--text2);line-height:1.5;margin-top:-3px;}
#map-map-editor .mme-hint b{min-width:0;text-align:left;font-size:11px;}
#map-map-editor .mme-actions{justify-content:flex-end;margin-bottom:0;margin-top:2px;}
/* 격자 위치 넛지 패드 (3×3 방향키) */
#grid-nudge-pad{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,22px);gap:2px;}
#grid-nudge-pad button{padding:0;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:4px;cursor:pointer;min-width:0;}
#grid-nudge-pad button:hover{color:var(--accent);border-color:var(--accent);}
#grid-nudge-pad .gn-up{grid-area:1/2;} #grid-nudge-pad .gn-left{grid-area:2/1;}
#grid-nudge-pad .gn-mid{grid-area:2/2;color:var(--text2);} #grid-nudge-pad .gn-right{grid-area:2/3;}
#grid-nudge-pad .gn-down{grid-area:3/2;}

/* ── GM 멀티맵 좌측 드로어 ── */
#map-drawer{
  position:fixed;top:44px;left:0;bottom:0;width:232px;z-index:15;
  background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border-right:1px solid var(--border2);
  display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .18s ease;
}
#map-drawer.open{transform:translateX(0);box-shadow:4px 0 18px rgba(0,0,0,.5);}
#map-drawer .md-head{padding:10px 12px;font-size:12px;font-weight:700;color:var(--accent);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
#map-drawer .md-head .md-x{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;line-height:1;}
#map-drawer .md-head .md-x:hover{color:var(--accent);}
#map-drawer .md-tabs{display:flex;border-bottom:1px solid var(--border);flex:0 0 auto;}
#map-drawer .md-tab{flex:1;background:none;border:none;color:var(--text2);font-size:12px;font-weight:700;
  padding:9px 0;cursor:pointer;border-bottom:2px solid transparent;}
#map-drawer .md-tab:hover{color:var(--text);}
#map-drawer .md-tab.on{color:var(--accent);border-bottom-color:var(--accent);}
#map-drawer .md-panel{display:flex;flex-direction:column;}
#map-drawer .md-hint{padding:8px 12px 2px;font-size:11px;color:var(--text2);line-height:1.5;}
#map-drawer .md-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#map-drawer .md-sect-h{padding:9px 12px 3px;font-size:11px;font-weight:700;color:var(--text2);}
#map-drawer .md-sect-h .md-sect-hint{font-weight:400;color:var(--border2);}
#map-drawer .md-list{padding:0 6px;}
#map-drawer .tp-list{padding:0 6px;}
#map-drawer .tp-empty{padding:8px 10px;font-size:11px;color:var(--text2);line-height:1.5;}
#map-drawer .tp-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:4px;border-radius:6px;
  background:var(--bg3);border:1px solid var(--border);cursor:grab;touch-action:none;}
#map-drawer .tp-row:hover{border-color:var(--accent);}
#map-drawer .tp-row:active{cursor:grabbing;}
/* 배치 토큰 추적 행: 클릭 선택(그랩 아님) + 강조 상태 */
#map-drawer .tk-row{cursor:pointer;}
#map-drawer .tk-row.on{border-color:#f5c518;background:rgba(245,197,24,.14);box-shadow:0 0 0 1px rgba(245,197,24,.4) inset;}
#map-drawer .tk-row .db-lv{color:var(--text2);font-size:10px;font-weight:400;}
#map-drawer .tp-thumb{width:30px;height:30px;border-radius:50%;flex:0 0 auto;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1a1a1a;border:1px solid var(--border2);}
#map-drawer .tp-name{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#map-drawer .db-panel .md-db-search{margin:8px 8px 6px;padding:6px 8px;background:var(--bg3);color:var(--text);
  border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;}
#map-drawer .db-panel .md-db-search:focus{border-color:var(--accent);}
#map-drawer .md-db-list{flex:1;}
#map-drawer .db-row{cursor:grab;}
#map-drawer .db-row .db-lv{color:var(--text2);font-size:10px;font-weight:400;}
#map-drawer .md-db-more{padding:6px 12px 12px;font-size:10px;color:var(--border2);text-align:center;}
#map-drawer .tp-act{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:5px;
  width:26px;height:28px;font-size:11px;cursor:pointer;flex:0 0 auto;}
#map-drawer .tp-act:hover{color:var(--accent);border-color:var(--accent);}
#map-drawer .tp-act.tp-del:hover{color:#fff;background:var(--accent);border-color:var(--accent);}
.tpl-ghost{position:fixed;z-index:9999;transform:translate(-50%,-50%);pointer-events:none;
  background:#6e1414;color:var(--cream);font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);white-space:nowrap;}
#map-drawer .md-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;border-radius:6px;padding:2px;}
#map-drawer .md-row.active{background:rgba(110,20,20,.12);outline:1px solid rgba(110,20,20,.4);}
#map-drawer .md-name{flex:1;text-align:left;background:var(--bg3);color:var(--text);border:1px solid var(--border);
  border-radius:5px;padding:7px 9px;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#map-drawer .md-row.active .md-name{color:var(--accent);font-weight:700;}
#map-drawer .md-name:hover{border-color:var(--accent);}
#map-drawer .md-act{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);
  border-radius:5px;width:28px;height:30px;font-size:12px;cursor:pointer;}
#map-drawer .md-act:hover{color:var(--accent);border-color:var(--accent);}
#map-drawer .md-act.md-del:hover{color:#fff;background:var(--accent);border-color:var(--accent);}
#map-drawer .md-add{margin:6px;padding:9px;background:var(--bg4);color:var(--text);border:1px dashed var(--border2);
  border-radius:6px;font-size:12px;cursor:pointer;}
#map-drawer .md-add:hover{color:var(--accent);border-color:var(--accent);}

/* ── GM NPC 편집기 ── */
#map-npc-editor{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;
  background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border:1px solid var(--border2);border-radius:10px;
  padding:14px 16px;width:min(300px,88%);box-shadow:0 8px 28px rgba(0,0,0,.55);
}
#map-npc-editor .ne-title{color:var(--accent);font-family:"Eczar",var(--bs);font-weight:700;font-size:14px;margin-bottom:10px;}
#map-npc-editor .ne-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--text2);}
#map-npc-editor .ne-row label{min-width:34px;}
#map-npc-editor input[type=text]{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:6px 8px;font-size:13px;}
#map-npc-editor select{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:5px;font-size:13px;}
#map-npc-editor .ne-hp{width:58px;flex:0 0 auto;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 6px;font-size:13px;text-align:center;}
#map-npc-editor .ne-hp-sep{color:var(--text2);font-weight:700;}

#map-npc-editor .ne-actions .ne-del:hover{background:#8a1a1a;color:#fff;border-color:#8a1a1a;}

/* ── 몬스터 연결 (토큰 편집기) ── */
#map-npc-editor .ne-monster{align-items:flex-start;}
.ne-monster .ml-wrap{position:relative;flex:1;}

#ml-current #ml-clear{background:none;border:1px solid var(--border2);color:#8a1a1a;border-radius:4px;font-size:10px;padding:1px 5px;cursor:pointer;margin-left:4px;}
#ml-search{width:100%;}
.ml-results{position:absolute;left:0;right:0;top:100%;z-index:50;max-height:240px;overflow-y:auto;background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;border:1px solid var(--border2);border-radius:8px;margin-top:3px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
.ml-item{padding:6px 9px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);}
.ml-item:last-child{border-bottom:none;}
.ml-item:hover{background:var(--bg3);}
.ml-item b{color:var(--text);} .ml-item i{color:var(--text2);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-item .ml-lv{color:#8a1a1a;font-size:10px;font-weight:700;}
.ml-empty{padding:8px;color:var(--text2);font-size:12px;text-align:center;}
/* ── 스탯 팝오버 ── */
#ml-stat-overlay{position:fixed;inset:0;z-index:10010;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.55);padding:24px 12px;overflow-y:auto;}
#ml-stat-card{position:relative;max-width:760px;width:100%;margin:auto;}
#ml-stat-close{position:absolute;top:-12px;right:-8px;z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:15px;cursor:pointer;}
#ml-stat-close:hover{color:var(--accent);border-color:var(--accent);}
/* ── 다이스 피드백 (cs_dice.js) ── */
#dice-toast-container{position:fixed;top:12px;right:12px;z-index:99999;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-height:60vh;overflow:hidden;}
.dice-toast{pointer-events:auto;min-width:180px;max-width:260px;background:#1e1e1e;border:1px solid #444;border-left:3px solid #3498db;border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);}
.dice-toast.show{transform:translateX(0);opacity:1;}
.dice-toast.hide{transform:translateX(120%);opacity:0;}
.dice-toast.nat20{border-color:#f1c40f;box-shadow:0 0 20px rgba(241,196,15,.4);}
.dice-toast.nat1{border-color:#e74c3c;box-shadow:0 0 20px rgba(231,76,60,.3);}
.dice-toast-header{display:flex;justify-content:space-between;align-items:center;}
.dice-toast-label{font-size:11px;color:#999;font-weight:600;}
.dice-toast-total{font-size:22px;font-weight:900;color:#3498db;}
.dice-toast.nat20 .dice-toast-total{color:#f1c40f;}
.dice-toast.nat1 .dice-toast-total{color:#e74c3c;}
.dice-toast-detail{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.dice-result-chip{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;}
.dice-result-chip.dice-max{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
.dice-result-chip.dice-min{opacity:.6;}
#dice-anim-overlay{position:fixed;inset:0;z-index:10020;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;}
#dice-anim-overlay.active{opacity:1;pointer-events:auto;}
#dice-anim-overlay.hidden{opacity:0;pointer-events:none;}
.dice-3d{width:64px;height:64px;position:relative;animation:diceRoll .8s cubic-bezier(.17,.67,.32,1.2) both;perspective:400px;}
.dice-3d-face{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;background:var(--color,#9b59b6);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.2);animation:diceSpin .7s cubic-bezier(.17,.67,.32,1.2) both;animation-delay:inherit;}
.dice-3d-label{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--color,#999);opacity:.7;}
@keyframes diceRoll{0%{transform:translateY(-80px) scale(0.3);opacity:0}40%{transform:translateY(10px) scale(1.1);opacity:1}60%{transform:translateY(-5px) scale(0.98)}100%{transform:translateY(0) scale(1)}}
@keyframes diceSpin{0%{transform:rotateX(720deg) rotateZ(360deg)}100%{transform:rotateX(0) rotateZ(0)}}
.dice-anim-total{position:absolute;bottom:24%;left:50%;transform:translateX(-50%);text-align:center;animation:totalPop .4s .6s both;}
.dice-anim-total-num{display:block;font-size:48px;font-weight:900;color:var(--accent,#d4a04a);text-shadow:0 2px 16px rgba(0,0,0,.6);}
.dice-anim-total.nat20 .dice-anim-total-num{color:#f1c40f;text-shadow:0 0 24px rgba(241,196,15,.6);}
.dice-anim-total.nat1 .dice-anim-total-num{color:#e74c3c;}
.dice-anim-total-label{font-size:12px;color:var(--text2,#999);}
@keyframes totalPop{0%{transform:translateX(-50%) scale(0);opacity:0}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1);opacity:1}}

</style>
</head>
<body>

<!-- 3D 물리 주사위 캔버스 (@3d-dice/dice-box, 오프라인 벤더링) -->
<div id="pf-dice-box" style="position:fixed;inset:0;z-index:10015;pointer-events:none;"></div>

<!-- 헤더 = 공유 셸(.app-header) — 다른 UI와 완전 동일(브랜드 + 우측 ⚙). 로비/역할/중지는 헤더에서 뺌 -->
<div id="map-topbar" class="app-header">
  <span class="app-brand" id="map-title">세션</span>
  <div class="hdr-actions">
    <button class="hdr-gear-btn" onclick="toggleGearMenu(event)" title="계정 · 설정" aria-label="설정">⚙</button>
  </div>
</div>

<!-- 설정/계정 팝업 (톱니) — 플레이어 시트·GM 로비와 동일 패턴, 플레이어 전용 옵션 제외 -->
<div id="gear-menu" onclick="event.stopPropagation()">
  <div class="gear-sec-head">범용</div>
  <div id="auth-area"><button class="btn btn-google" onclick="googleLogin()">Google 로그인</button></div>
  <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="location.href='GMSheet.html'">🔁 로비로 돌아가기</button>
  <button id="pwa-install-btn" class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="pfInstallApp()">📲 웹앱 설치</button>
  <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="openChangelog()">📋 업데이트 로그<span id="gear-changelog-dot" class="gear-update-dot" style="display:none;"></span></button>
  <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="openBugReport()">🐞 버그 제보</button>
</div>

<!-- 세션 준비중(중지) 상태바 — 헤더 아래 우상단. 버튼 아님(스페이스바로 전환). GM 뷰에서만 표시 -->
<div id="map-pause-status" title="스페이스바로 세션 준비중(중지)/진행 전환" style="display:none;">▶ 진행 중</div>

<!-- 플레이어 화면 CCTV (GM 우하단 — 팝아웃 창 캔버스를 실시간 미러링) -->
<div id="map-cctv" style="display:none;">
  <div id="map-cctv-hd"><span>📺 플레이어 화면</span><button onclick="MapGlue.cctvToggle(false)" title="닫기">✕</button></div>
  <img id="map-cctv-img" alt="">
  <div id="map-cctv-empty">플레이어 창을 열면<br>여기 실시간 표시됩니다</div>
</div>

<!-- GM 멀티맵 드로어 (좌측, 토글) -->
<div id="map-drawer">
  <div class="md-head"><span>드로어</span><button class="md-x" onclick="MapView.toggleDrawer()" title="닫기">✕</button></div>
  <div class="md-tabs">
    <button id="md-tab-maps" class="md-tab on" onclick="MapView.setDrawerTab('maps')">🗺 지도</button>
    <button id="md-tab-tokens" class="md-tab" onclick="MapView.setDrawerTab('tokens')">🎭 배치 토큰</button>
    <button id="md-tab-creatures" class="md-tab" onclick="MapView.setDrawerTab('creatures')">🐉 크리처</button>
    <button id="md-tab-hazards" class="md-tab" onclick="MapView.setDrawerTab('hazards')">⚠ 해저드</button>
  </div>
  <div class="md-scroll" id="md-scroll">
    <div id="md-panel-maps" class="md-panel">
      <div class="md-list" id="map-drawer-list"></div>
      <button class="md-add" onclick="MapView.addMap()">＋ 새 지도</button>
    </div>
    <div id="md-panel-tokens" class="md-panel" style="display:none;">
      <div class="md-hint">이 지도에 배치된 토큰. 누르면 위치를 강조하고 편집창이 열립니다. (토큰 추가는 「크리처」 탭에서 드래그)</div>
      <div class="tp-list" id="map-token-list"></div>
    </div>
    <div id="md-panel-creatures" class="md-panel db-panel" style="display:none;">
      <input id="md-crit-search" class="md-db-search" type="text" placeholder="크리처 검색 (한/영)…" autocomplete="off" oninput="MapView.dbSearch('creatures', this.value)">
      <div class="tp-list md-db-list" id="md-crit-list"></div>
      <div class="md-db-more" id="md-crit-more"></div>
    </div>
    <div id="md-panel-hazards" class="md-panel db-panel" style="display:none;">
      <input id="md-haz-search" class="md-db-search" type="text" placeholder="해저드 검색 (한/영)…" autocomplete="off" oninput="MapView.dbSearch('hazards', this.value)">
      <div class="tp-list md-db-list" id="md-haz-list"></div>
      <div class="md-db-more" id="md-haz-more"></div>
    </div>
  </div>
</div>

<!-- 지도 (세션 종속 독립 뷰) -->
<div id="map-stage">
  <canvas id="map-canvas"></canvas>
  <div id="map-empty"></div>
  <div id="map-toolbar">
    <!-- GM 전용, 세로 배치 (플레이어 시점이면 숨김). 아이콘만 — 라벨은 title 툴팁. -->
    <button id="map-drawer-btn" class="ic" style="display:none;" title="지도 드로어" onclick="MapView.toggleDrawer()">☰</button>
    <button id="fog-btn-select" class="ic" style="display:none;" title="선택 (팬/토큰 이동)" onclick="MapView.setSelectTool()">🖐</button>
    <button id="fog-btn-reveal" class="ic" style="display:none;" title="공개" onclick="MapView.toggleFogMenu('reveal')">🔆</button>
    <button id="fog-btn-recover" class="ic" style="display:none;" title="숨기기" onclick="MapView.toggleFogMenu('recover')">🌑</button>
    <button id="area-btn" class="ic" style="display:none;" title="영역 (AoE)" onclick="MapView.toggleAreaMenu()">📐</button>
    <button id="pin-btn" class="ic" style="display:none;" title="마스터링 핀 (GM 전용 — 플레이어에겐 안 보임)" onclick="MapView.togglePinMenu()">📌</button>
    <button id="cam-btn" class="ic" style="display:none;" title="카메라 제어 (플레이어 창/동기화/CCTV)" onclick="MapView.toggleCamMenu()">🎥</button>
  </div>
  <!-- 안개 공개 확장 메뉴 (자유/원/사각/전체) — 아이콘만 -->
  <div id="fog-menu-reveal" class="fog-menu ic-menu" style="display:none;">
    <button data-fs="reveal:free" title="자유" onclick="MapView.setFogTool('reveal','free')">✏</button>
    <button data-fs="reveal:circle" title="원" onclick="MapView.setFogTool('reveal','circle')">◯</button>
    <button data-fs="reveal:rect" title="사각" onclick="MapView.setFogTool('reveal','rect')">▭</button>
    <button title="전체 공개" onclick="MapView.revealAll()">⬜</button>
  </div>
  <!-- 안개 숨기기 확장 메뉴 (자유/원/사각/전체) — 아이콘만 -->
  <div id="fog-menu-recover" class="fog-menu ic-menu" style="display:none;">
    <button data-fs="recover:free" title="자유" onclick="MapView.setFogTool('recover','free')">✏</button>
    <button data-fs="recover:circle" title="원" onclick="MapView.setFogTool('recover','circle')">◯</button>
    <button data-fs="recover:rect" title="사각" onclick="MapView.setFogTool('recover','rect')">▭</button>
    <button title="전체 숨기기" onclick="MapView.coverAll()">⬛</button>
  </div>
  <!-- AoE 영역 확장 메뉴 (폭발/원뿔/직선/지우기) — 아이콘만 -->
  <div id="area-menu" class="fog-menu ic-menu" style="display:none;">
    <button data-area="circle" title="폭발/방출 (원)" onclick="MapView.setAreaTool('circle')">💥</button>
    <button data-area="cone" title="원뿔" onclick="MapView.setAreaTool('cone')">🔺</button>
    <button data-area="line" title="직선" onclick="MapView.setAreaTool('line')">📏</button>
    <button title="영역 모두 지우기" onclick="MapView.clearAreas()">🧹</button>
  </div>
  <!-- GM 마스터링 핀 확장 메뉴 (환경/조우/함정/보물/NPC) — GM 전용. 종류 선택 후 지도를 탭하면 배치. -->
  <div id="pin-menu" class="fog-menu ic-menu" style="display:none;">
    <button data-pin="env"       title="환경" onclick="MapView.setPinTool('env')">🌲</button>
    <button data-pin="encounter" title="조우" onclick="MapView.setPinTool('encounter')">⚔️</button>
    <button data-pin="trap"      title="함정" onclick="MapView.setPinTool('trap')">🪤</button>
    <button data-pin="treasure"  title="보물" onclick="MapView.setPinTool('treasure')">💰</button>
    <button data-pin="npc"       title="NPC"  onclick="MapView.setPinTool('npc')">👤</button>
  </div>
  <!-- 카메라 제어 확장 메뉴 (듀얼모니터 GM: 플레이어 창/동기화/따라가기/CCTV) — 헤더에서 이동 -->
  <div id="cam-menu" class="fog-menu cam-menu" style="display:none;">
    <button id="mt-popout" onclick="MapGlue.openPlayerWindow()" title="플레이어 모니터용 별도 창(플레이어 시점) 열기">🖥 플레이어 창</button>
    <button id="mt-sync" onclick="MapGlue.syncNow()" title="플레이어 화면을 지금 내 카메라로 전환">🔄 동기화</button>
    <label id="mt-follow" title="내 카메라 이동을 플레이어 화면이 계속 따라감"><input type="checkbox" onchange="MapGlue.setFollow(this.checked)"> 📡 따라가기</label>
    <button id="mt-cctv" onclick="MapGlue.cctvToggle()" title="플레이어 화면 미리보기(CCTV) 켜기/끄기">📺 CCTV</button>
  </div>
  <!-- 확대축소 버튼 제거(사용자 요청): 확대축소는 핀치/휠 제스처로. -->
  <input id="map-bg-input" type="file" accept="image/*" style="display:none;">

  <!-- GM 토큰 편집기 (드로어 팔레트 전용 — 토큰 만들기/편집) -->
  <div id="map-npc-editor" style="display:none;">
    <div class="ne-title" id="np-title">토큰 편집</div>
    <div class="ne-row"><label>이름</label><input id="np-name" type="text" onchange="MapView.npcApply()"></div>
    <div class="ne-row"><label>크기</label><select id="np-size" onchange="MapView.npcApply()"></select></div>
    <div class="ne-row"><label>체력</label>
      <input id="np-hp" type="number" min="0" inputmode="numeric" class="ne-hp" onchange="MapView.npcApply()">
      <span class="ne-hp-sep">/</span>
      <input id="np-hpmax" type="number" min="0" inputmode="numeric" class="ne-hp" onchange="MapView.npcApply()">
      <span class="ne-hint">현재 / 최대</span></div>
    <div class="ne-row ne-monster"><label>능력</label>
      <div class="ml-wrap">
        <div id="ml-current" class="ml-current"><span id="ml-current-text">연결 안 됨</span> <button type="button" id="ml-clear" onclick="MonsterLink.clearLink()" style="display:none;">해제</button></div>
        <input id="ml-search" type="text" placeholder="몬스터 검색 (한/영)…" autocomplete="off" oninput="MonsterLink.onSearch(this.value)" onfocus="MonsterLink.ensure()">
        <div id="ml-results" class="ml-results" style="display:none;"></div>
      </div>
    </div>
    <div class="ne-row"><label class="ne-check"><input id="np-hidden" type="checkbox" onchange="MapView.npcApply()"> 숨김 (플레이어에게 안 보임)</label></div>
    <div class="ne-row ne-actions">
      <button id="np-statbtn" style="display:none;" onclick="MapView.npcShowStat()">📋 정보</button>
      <button onclick="MapView.npcPickPortrait()">🖼 이미지</button>
      <button class="ne-del" onclick="MapView.npcDelete()">삭제</button>
      <button onclick="MapView.npcClose()">닫기</button>
    </div>
    <input id="np-portrait-input" type="file" accept="image/*" style="display:none;">
  </div>

  <!-- 배치된 토큰 탭 → 숨기기/제거 빠른 버튼 -->
  <div id="map-token-actions" style="display:none;">
    <span id="mta-hp" class="mta-hp" style="display:none;"></span>
    <input id="mta-hp-amt" type="number" min="0" inputmode="numeric" placeholder="값" style="display:none;" onkeydown="if(event.key==='Enter')MapView.tokenActionDamage()">
    <button id="mta-dmg" style="display:none;" onclick="MapView.tokenActionDamage()">−피해</button>
    <button id="mta-heal" style="display:none;" onclick="MapView.tokenActionHeal()">＋회복</button>
    <button id="mta-stat" style="display:none;" onclick="MapView.tokenActionStat()">📋 스탯</button>
    <button id="mta-edit" onclick="MapView.tokenActionEdit()">✎ 편집</button>
    <button id="mta-hide" onclick="MapView.tokenActionHide()">🙈 숨기기</button>
    <button id="mta-del" onclick="MapView.tokenActionRemove()">🗑 제거</button>
  </div>

  <!-- GM 지도 편집기 (드로어 ✎로 열림 — 이름/배경/격자) -->
  <div id="map-map-editor" style="display:none;">
    <div class="mme-title">지도 편집</div>
    <div class="mme-row"><label>이름</label><input id="mme-name" type="text" onchange="MapView.mapRename()"></div>
    <div class="mme-row"><label>배경</label><button id="map-upload-btn" onclick="MapView.pickBg()">🖼 이미지 선택</button><button onclick="MapView.uploadBgOriginal()" title="원본 화질 그대로 리포(dev/maps/)에 커밋하고 URL 참조로 적용합니다. GitHub 토큰 필요(최초 1회).">⬆ 원본 업로드</button><span id="mme-bg-status" class="mme-status"></span></div>
    <div class="mme-row"><label>URL</label><input id="mme-bg-url" type="text" placeholder="maps/이름.jpg 또는 https://…" spellcheck="false"><button onclick="MapView.applyBgUrl()">적용</button></div>
    <div class="mme-row mme-hint">이미지 선택=빠른 업로드(1500px 축소) · <b>원본 업로드</b>=리포 커밋 후 원본 해상도 참조(GitHub 토큰 최초 1회) · URL=직접 참조. 빈 칸+적용=해제.</div>
    <div class="mme-row"><label class="mme-check"><input id="mme-grid-on" type="checkbox" onchange="MapView.toggleGrid()"> 격자 표시</label></div>
    <div class="mme-row"><label>비율</label>
      <input id="map-grid-range" type="range" min="0" max="100" value="20" oninput="MapView.gridRangeInput(this.value)" onchange="MapView.gridRangeChange(this.value)">
      <b id="map-grid-val">20%</b> <span id="map-grid-info" class="mme-status"></span></div>
    <div class="mme-row"><label>위치</label>
      <div id="grid-nudge-pad" title="배경 격자에 맞춰 상하좌우 이동">

<script>
// ── 지도 전용 글루 (캐릭터 시트와 독립) ──
let currentUser = null;
var state = { portrait: null };          // cs_map.js가 state.portrait 참조 (GM 뷰는 토큰 생성 안 함)
window._mapNoProvision = true;           // 독립 지도 = GM/미리보기 뷰 → 토큰 자동생성 안 함

const _params = new URLSearchParams(location.search);
const _sessionId = _params.get('session');
const _role = _params.get('role') || 'gm';
const _isDisplay = (_params.get('display') === 'player');   // 플레이어 디스플레이 창/CCTV
const _isMini = (_params.get('mini') === '1');              // CCTV 작은 미리보기
// GM '플레이어 모드로 보기'(role=player) = 플레이어 시점 안개 + 토큰은 전부 안개 위로(GM이 위치 확인)
// 단, 디스플레이 창은 진짜 플레이어 시점(안개 가려진 것/숨김 토큰 안 보임) — 위로 띄우지 않음.
window._mapTokensAboveFog = (_role === 'player' && !_isDisplay);
if (_isDisplay) {
  window._mapDisplayPlayer = true;                          // cs_map: 진짜 플레이어 렌더 + 무조작
  document.body.classList.add('map-display');
  if (_isMini) document.body.classList.add('map-mini');
}

auth.onAuthStateChanged(async function(user) {
  _updateGearAuth(user);                    // ⚙ 계정 영역 갱신(로그인/아웃)
  const emptyEl = document.getElementById('map-empty');
  if (!user) {
    emptyEl.style.display = 'flex';
    emptyEl.textContent = '로그인이 필요합니다. 로비(GMSheet)에서 로그인 후 다시 진입하세요.';
    return;
  }
  currentUser = user;
  if (!_sessionId) { alert('세션 ID가 없습니다.'); location.href = 'GMSheet.html'; return; }
  let data;
  try {
    const doc = await db.collection(PF_COL.sessions).doc(_sessionId).get();
    if (!doc.exists) { alert('세션을 찾을 수 없습니다.'); location.href = 'GMSheet.html'; return; }
    data = doc.data();
  } catch (e) { console.error('[Map session]', e); alert('세션 로드 실패: ' + e.message); location.href = 'GMSheet.html'; return; }

  document.getElementById('map-title').textContent = data.name || '세션';
  const isGM = (_role === 'gm');

  if (typeof MapSync !== 'undefined') MapSync.start(_sessionId, { isGM: isGM, uid: user.uid });

  // GM 카메라 도구는 툴바 🎥 카메라 플라이아웃(_refreshCamToolbar가 _effGM 게이트)으로 노출
  MapGlue.init();
});

// ── 헤더 톱니(⚙) 메뉴 + 계정 — index.html/GMSheet와 동일 패턴(플레이어 전용 옵션 제외) ──
function toggleGearMenu(ev){ if(ev)ev.stopPropagation(); var m=document.getElementById('gear-menu'), g=document.querySelector('.hdr-gear-btn'); if(!m)return; if(typeof updateChangelogDot==='function')updateChangelogDot(); var open=m.classList.toggle('open'); if(g)g.classList.toggle('open',open); }
function closeGearMenu(){ var m=document.getElementById('gear-menu'), g=document.querySelector('.hdr-gear-btn'); if(m)m.classList.remove('open'); if(g)g.classList.remove('open'); }
document.addEventListener('click', function(e){ var m=document.getElementById('gear-menu'); if(!m||!m.classList.contains('open'))return; if(e.target.closest&&(e.target.closest('#gear-menu')||e.target.closest('.hdr-gear-btn')))return; closeGearMenu(); });
function googleLogin(){ try{ var p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(function(e){alert('로그인 실패: '+e.message);}); }catch(e){alert('로그인 실패: '+e.message);} }

function _updateGearAuth(user){ var a=document.getElementById('auth-area'); if(!a)return;
  if(user){ a.innerHTML='<span class="auth-user">'+(user.displayName||user.email||'')+'</span><button class="btn btn-ghost" onclick="googleLogout()">로그아웃</button>'; }
  else { a.innerHTML='<button class="btn btn-google" onclick="googleLogin()">Google 로그인</button>'; } }

// ── 듀얼모니터 글루: GM 카메라 ↔ 플레이어 디스플레이/CCTV (같은 브라우저 BroadcastChannel) ──
window.MapGlue = (function () {
  const bc = (typeof BroadcastChannel !== 'undefined' && _sessionId) ? new BroadcastChannel('pf2e-mapcam-' + _sessionId) : null;
  let _follow = false, _followRAF = 0, _lastKey = '';
  let _popWin = null, _cctvClosed = false, _frameTimer = 0, _off = null, _lastFrame = 0;
  function _cam() { return (typeof MapView !== 'undefined' && MapView.getCameraShare) ? MapView.getCameraShare() : null; }
  function _post() { const c = _cam(); if (bc && c) bc.postMessage({ type: 'cam', cam: c }); }
  function syncNow() { _post(); }
  function setFollow(on) {
    _follow = on;
    if (on) { _lastKey = ''; _loop(); } else if (_followRAF) { cancelAnimationFrame(_followRAF); _followRAF = 0; }
  }
  function _loop() {                                   // 따라가기: 카메라 변할 때만 방송(throttle)
    if (!_follow) return;
    const c = _cam();
    if (c) { const k = c.cx.toFixed(1) + ',' + c.cy.toFixed(1) + ',' + c.scale.toFixed(3);
      if (k !== _lastKey) { _lastKey = k; if (bc) bc.postMessage({ type: 'cam', cam: c }); } }
    _followRAF = requestAnimationFrame(_loop);
  }
  // 디스플레이(팝아웃/플레이어 창) → GM CCTV: 캔버스를 축소 캡처해 ~4fps 방송
  function _startFrames() {
    if (_frameTimer || !bc) return;
    _frameTimer = 1;                                     // 시작 가드(중복 방지)
    // 고정 크기 프레임(320x180). 변화(렌더)가 있을 때만 캡처·전송 → 정지화면은 재전송 안 함(움찔 없음)
    const FW = 320, FH = 180;
    _off = document.createElement('canvas');
    _off.width = FW; _off.height = FH;
    const ctx = _off.getContext('2d');
    let _last = 0, _pending = false;
    function capture() {
      try {
        if (document.hidden) return;
        const cv = document.getElementById('map-canvas');
        if (!cv || !cv.width || !cv.height) return;
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, FW, FH);
        const sc = Math.min(FW / cv.width, FH / cv.height);   // contain (비율 유지)
        const dw = Math.round(cv.width * sc), dh = Math.round(cv.height * sc);
        ctx.drawImage(cv, Math.round((FW - dw) / 2), Math.round((FH - dh) / 2), dw, dh);
        bc.postMessage({ type: 'frame', img: _off.toDataURL('image/jpeg', 0.6) });
      } catch (e) { console.warn('[CCTV] 캡처 실패:', e && e.message); }
    }
    function onChange() {                                // 화면 변화 시에만(애니메이션은 ~10fps throttle)
      const now = Date.now();
      if (now - _last >= 100) { _last = now; capture(); }
      else if (!_pending) { _pending = true; setTimeout(function () { _pending = false; _last = Date.now(); capture(); }, 100); }
    }
    if (typeof MapView !== 'undefined' && MapView.onRender) MapView.onRender(onChange);
    setTimeout(capture, 400);                            // 초기 1프레임
  }
  function _onFrame(data) {                            // GM: 수신 프레임을 CCTV에 표시
    const el = document.getElementById('map-cctv'), img = document.getElementById('map-cctv-img'), emp = document.getElementById('map-cctv-empty');
    if (!el || !img || _cctvClosed) return;
    if (el.style.display === 'none' || !el.style.display) { el.style.display = 'block'; const b = document.getElementById('mt-cctv'); if (b) b.classList.add('on'); }
    img.src = data; if (emp) emp.style.display = 'none'; _lastFrame = Date.now();
  }
  function openPlayerWindow() {
    const u = 'Map.html?session=' + encodeURIComponent(_sessionId) + '&display=player&_cb=' + Date.now();
    try { if (_popWin && !_popWin.closed) _popWin.close(); } catch (e) {}   // 기존 창 닫고 최신 코드로 새로 열기(캐시 우회)
    _popWin = window.open(u, 'pf2ePlayerView', 'popup,width=1280,height=800');
    if (!_popWin) { alert('팝업이 차단되었습니다. 브라우저에서 이 사이트의 팝업을 허용한 뒤 다시 누르세요.'); return; }
    _cctvClosed = false; cctvToggle(true);             // 팝아웃 열면 GM 우하단 CCTV도 자동 표시(프레임 도착 시 채워짐)
    setTimeout(_post, 800);                            // 새 창이 카메라 요청 못 받아도 한 번 밀어줌
  }
  function cctvToggle(force) {
    const el = document.getElementById('map-cctv'), btn = document.getElementById('mt-cctv');
    if (!el) return;
    const show = (force === undefined) ? (el.style.display === 'none' || !el.style.display) : !!force;
    if (show) { _cctvClosed = false; el.style.display = 'block'; if (btn) btn.classList.add('on'); }
    else { _cctvClosed = true; el.style.display = 'none'; if (btn) btn.classList.remove('on'); }
  }
  function init() {
    if (bc) bc.onmessage = function (e) {
      const m = e.data || {};
      if (_isDisplay) { if (m.type === 'cam' && m.cam && MapView.applyCameraShare) MapView.applyCameraShare(m.cam); }
      else {                                           // GM 측 수신
        if (m.type === 'req') _post();                 // 새 디스플레이 진입 → 현재 카메라 응답
        else if (m.type === 'frame') _onFrame(m.img);  // 플레이어 창 화면 미러
      }
    };
    if (_isDisplay && bc) {
      setTimeout(function () { bc.postMessage({ type: 'req' }); }, 700);  // 진입 시 현재 카메라 받아오기
      _startFrames();                                  // 내 캔버스를 GM CCTV로 방송
    }
  }
  return { init: init, syncNow: syncNow, setFollow: setFollow, openPlayerWindow: openPlayerWindow, cctvToggle: cctvToggle };
})();
</script>

<!-- ── 몬스터 연결 글루: 토큰 ↔ MonsterDB (지연 로드 26MB, 검색·스탯 팝오버·굴림) ── -->
<script>
window.MonsterLink = (function () {
  'use strict';
  let _loaded = false, _loading = null, _sel = null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function ensure() {                              // 첫 사용 시에만 26MB 로드(지도 진입은 가볍게 유지)
    if (_loaded) return Promise.resolve();
    if (_loading) return _loading;
    if (typeof MonsterDB === 'undefined') return Promise.reject(new Error('MonsterDB 모듈 없음'));
    MonsterDB.injectStyles();
    _loading = MonsterDB.load({ dir: 'data/creatures/' }).then(() => { _loaded = true; })
      .catch(e => { _loading = null; throw e; });
    return _loading;
  }

  function _setLabel(text, linked) {
    const t = document.getElementById('ml-current-text'); if (t) t.textContent = text;
    const clr = document.getElementById('ml-clear'); if (clr) clr.style.display = linked ? '' : 'none';
  }
  function onEditOpen(id, t) {                     // 편집기 열릴 때 cs_map.js가 호출
    _sel = { monsterId: (t && t.monsterId) || null, monsterName: (t && t.monsterName) || null, hpMax: (t && t.hpMax) || 0 };
    _setLabel(_sel.monsterName ? ('🔗 ' + _sel.monsterName + (_sel.hpMax ? ' (HP ' + _sel.hpMax + ')' : '')) : '연결 안 됨', !!_sel.monsterId);
    const s = document.getElementById('ml-search'); if (s) s.value = '';
    const r = document.getElementById('ml-results'); if (r) { r.style.display = 'none'; r.innerHTML = ''; }
  }
  function getSelection() { return _sel; }         // npcApply가 저장 직전에 호출

  function onSearch(q) {
    const r = document.getElementById('ml-results'); if (!r) return;
    q = (q || '').trim();
    if (!q) { r.style.display = 'none'; r.innerHTML = ''; return; }
    r.innerHTML = '<div class="ml-empty">불러오는 중…</div>'; r.style.display = 'block';
    ensure().then(() => {
      const hits = MonsterDB.search(q).slice(0, 40);
      if (!hits.length) { r.innerHTML = '<div class="ml-empty">결과 없음</div>'; return; }
      r.innerHTML = hits.map(c => {
        const n = MonsterDB.name(c), lv = MonsterDB.level(c);
        return '<div class="ml-item" data-id="' + esc(c.id) + '" data-nm="' + esc(n.ko) +
               '"><b>' + esc(n.ko) + '</b> <i>' + esc(n.en) + '</i><span class="ml-lv">Lv ' + lv + '</span></div>';
      }).join('');
      r.querySelectorAll('.ml-item').forEach(el => el.onclick = () => pick(el.getAttribute('data-id'), el.getAttribute('data-nm')));
    }).catch(e => { r.innerHTML = '<div class="ml-empty">로드 실패: ' + esc(e.message) + '</div>'; });
  }

  function pick(id, nm) {
    let hpMax = 0;
    try {                                            // 연결 몬스터 기준 크기·HP 자동 + 이름 비어있으면 채움
      const c = MonsterDB.getCreature(id);
      if (c) {
        const SIZECAT = { tiny:'tiny', sm:'small', med:'medium', lg:'large', huge:'huge', grg:'gargantuan' };
        const tr = MonsterDB.traits(c), sizeSel = document.getElementById('np-size');
        if (sizeSel && tr.size && SIZECAT[tr.size]) sizeSel.value = SIZECAT[tr.size];
        const nameInp = document.getElementById('np-name');
        if (nameInp && !nameInp.value.trim()) nameInp.value = nm;
        hpMax = (MonsterDB.hp(c) || {}).max || 0;
      }
    } catch (e) {}
    _sel = { monsterId: id, monsterName: nm, hpMax: hpMax };
    const r = document.getElementById('ml-results'); if (r) { r.style.display = 'none'; r.innerHTML = ''; }
    const s = document.getElementById('ml-search'); if (s) s.value = '';
    _setLabel('🔗 ' + nm + (hpMax ? ' (HP ' + hpMax + ')' : ''), true);
    if (typeof MapView !== 'undefined' && MapView.npcApply) MapView.npcApply();   // monsterId+크기+이름+hpMax 저장
  }

  function clearLink() {
    _sel = { monsterId: null, monsterName: null, hpMax: 0 };
    _setLabel('연결 안 됨', false);
    if (typeof MapView !== 'undefined' && MapView.npcApply) MapView.npcApply();
  }

  function showStat(id) {                           // 배치 토큰 📋 → 스탯블록 팝오버 + 굴림
    ensure().then(() => {
      let ov = document.getElementById('ml-stat-overlay');
      if (!ov) {
        ov = document.createElement('div'); ov.id = 'ml-stat-overlay';
        ov.innerHTML = '<div id="ml-stat-card"><button id="ml-stat-close" title="닫기">✕</button><div id="ml-stat-body"></div></div>';
        document.body.appendChild(ov);
        ov.addEventListener('click', e => { if (e.target === ov) ov.style.display = 'none'; });
        ov.querySelector('#ml-stat-close').onclick = () => ov.style.display = 'none';
        MonsterDB.bindRolls(ov.querySelector('#ml-stat-body'));      // 위임 바인드 1회(재렌더 안전)
      }
      ov.querySelector('#ml-stat-body').innerHTML = MonsterDB.renderStatBlock(id);
      ov.style.display = 'flex';
    }).catch(e => alert('몬스터 데이터 로드 실패: ' + e.message));
  }

  return { ensure, onEditOpen, getSelection, onSearch, pick, clearLink, showStat };
})();
</script>

<!-- 3D 물리 주사위 (@3d-dice/dice-box, 벤더링·오프라인). 실패 시 cs_dice가 2D로 폴백 -->
<script type="module">
  // 플레이어 디스플레이 창(display=player)은 수동 뷰 → 3D 주사위/추가 WebGL 캔버스 불필요(리사이즈 충돌 방지)
  if (new URLSearchParams(location.search).get('display') === 'player') {
    const _b = document.getElementById('pf-dice-box'); if (_b) _b.remove();
  } else {
  try {
    const { default: DiceBox } = await import('./dice/dice-box.es.min.js?v=0.226');
    const assetPath = new URL('dice/assets/', document.baseURI).pathname;
    const box = new DiceBox({ container: '#pf-dice-box', assetPath, theme: 'default', offscreen: false, scale: 6 });
    let ready = false;
    box.init().then(() => { ready = true; }).catch(e => console.warn('[PFDice] init 실패(2D 폴백):', e));
    const _ls = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    window.PFDice = {
      available() { return ready && _ls('pf2e_dice3d') !== 'off'; },
      async roll(notation) { const color = _ls('pf2e_dice_color') || undefined; const res = await box.roll(notation, color ? { themeColor: color } : undefined); return (res || []).map(r => ({ sides: Number(r.sides), value: r.value })); },
      clear() { try { box.clear(); } catch (e) {} },
    };
  } catch (e) { console.warn('[PFDice] 모듈 로드 실패(2D 폴백):', e); }
  }
</script>
