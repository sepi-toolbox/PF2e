<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전술 지도 · Pathforge</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

const auth = firebase.auth();
const db = firebase.firestore();

<style>
:root{
  --bg:#1c1c1c; --bg2:#222; --bg3:#2a2a2a; --bg4:#333; --text:#ddd; --text2:#999;
  --border:#444; --border2:#555; --accent:#c9a84c; --gold:#c9a84c;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0c0c0c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}

/* 상단 바 (지도 전용 — 캐릭터 시트와 독립) */
#map-topbar{
  position:fixed;top:0;left:0;right:0;height:44px;z-index:20;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:#161616;border-bottom:1px solid var(--border);
}
#map-topbar .mt-back{
  background:var(--bg4);color:var(--text);border:1px solid var(--border);
  border-radius:5px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
}
#map-topbar .mt-back:hover{background:var(--accent);color:#1a1a1a;}
#map-topbar .mt-title{color:var(--accent);font-weight:700;font-size:14px;}
#map-topbar .mt-role{color:var(--text2);font-size:12px;margin-left:auto;}

/* 지도 영역 (상단 바 아래 전체) — 높이는 cs_map.js _resize가 px로 지정 */
#map-stage{
  position:fixed;top:44px;left:0;right:0;bottom:0;
  background:#0c0c0c;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
#map-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#map-empty{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:var(--text2);font-size:13px;text-align:center;padding:24px;line-height:1.6;pointer-events:none;
}
#map-toolbar{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;}
#map-toolbar button{
  background:rgba(20,20,20,.82);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;
}
#map-toolbar button:hover{background:rgba(42,42,42,.95);color:var(--accent);}
#map-toolbar button:disabled{opacity:.6;cursor:default;}
#map-toolbar button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700;}
#map-fog-bar{
  position:absolute;top:42px;left:8px;z-index:5;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  background:rgba(16,16,16,.86);border:1px solid var(--border);border-radius:8px;padding:5px 7px;
}
#map-fog-bar button{
  background:rgba(40,40,40,.9);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;
}
#map-fog-bar button:hover{color:var(--accent);}
#map-fog-bar button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700;}
#map-fog-bar .map-fog-size{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
#map-fog-bar .map-fog-size b{color:var(--text);min-width:14px;text-align:center;}
#map-zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:5;}
#map-zoom button{
  width:38px;height:38px;font-size:18px;line-height:1;
  background:rgba(20,20,20,.82);color:var(--text);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;
}
#map-zoom button:active{background:var(--bg4);}

/* ── GM 멀티맵 좌측 드로어 ── */
#map-drawer{
  position:fixed;top:44px;left:0;bottom:0;width:232px;z-index:15;
  background:#141414;border-right:1px solid var(--border);
  display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .18s ease;
}
#map-drawer.open{transform:translateX(0);box-shadow:4px 0 18px rgba(0,0,0,.5);}
#map-drawer .md-head{padding:10px 12px;font-size:12px;font-weight:700;color:var(--accent);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
#map-drawer .md-head .md-x{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;line-height:1;}
#map-drawer .md-head .md-x:hover{color:var(--accent);}
#map-drawer .md-list{flex:1;overflow-y:auto;padding:6px;}
#map-drawer .md-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;border-radius:6px;padding:2px;}
#map-drawer .md-row.active{background:rgba(201,168,76,.16);outline:1px solid rgba(201,168,76,.5);}
#map-drawer .md-name{flex:1;text-align:left;background:var(--bg3);color:var(--text);border:1px solid var(--border);
  border-radius:5px;padding:7px 9px;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#map-drawer .md-row.active .md-name{color:var(--accent);font-weight:700;}
#map-drawer .md-name:hover{border-color:var(--accent);}
#map-drawer .md-act{background:rgba(40,40,40,.9);color:var(--text2);border:1px solid var(--border);
  border-radius:5px;width:28px;height:30px;font-size:12px;cursor:pointer;}
#map-drawer .md-act:hover{color:var(--accent);}
#map-drawer .md-act.md-del:hover{color:#e07070;border-color:#5a2a2a;}
#map-drawer .md-add{margin:6px;padding:9px;background:var(--bg4);color:var(--text);border:1px dashed var(--border2);
  border-radius:6px;font-size:12px;cursor:pointer;}
#map-drawer .md-add:hover{color:var(--accent);border-color:var(--accent);}

/* ── GM NPC 편집기 ── */
#map-npc-editor{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;
  background:rgba(20,20,22,.97);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;width:min(300px,88%);box-shadow:0 8px 28px rgba(0,0,0,.6);
}
#map-npc-editor .ne-title{color:var(--accent);font-weight:700;font-size:13px;margin-bottom:10px;}
#map-npc-editor .ne-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--text2);}
#map-npc-editor .ne-row label{min-width:34px;}
#map-npc-editor input[type=text]{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:6px 8px;font-size:13px;}
#map-npc-editor select{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:5px;font-size:13px;}
#map-npc-editor .ne-check{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer;}
#map-npc-editor .ne-actions{justify-content:flex-end;gap:8px;margin-bottom:0;margin-top:4px;}
#map-npc-editor .ne-actions button{background:rgba(40,40,40,.9);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;}
#map-npc-editor .ne-actions button:hover{color:var(--accent);}
#map-npc-editor .ne-actions .ne-del{color:#e07070;border-color:#5a2a2a;}
#map-npc-editor .ne-actions .ne-del:hover{background:#5a2a2a;color:#fff;}
</style>
</head>
<body>

<div id="map-topbar">
  <button class="mt-back" onclick="location.href='GMSheet.html'">← 로비</button>
  <span class="mt-title" id="map-title">세션</span>
  <span class="mt-role" id="map-role"></span>
</div>

<!-- GM 멀티맵 드로어 (좌측, 토글) -->
<div id="map-drawer">
  <div class="md-head"><span>저장된 지도</span><button class="md-x" onclick="MapView.toggleDrawer()" title="닫기">✕</button></div>
  <div class="md-list" id="map-drawer-list"></div>
  <button class="md-add" onclick="MapView.addMap()">＋ 새 지도</button>
</div>

<!-- 지도 (세션 종속 독립 뷰) -->
<div id="map-stage">
  <canvas id="map-canvas"></canvas>
  <div id="map-empty"></div>
  <div id="map-toolbar">
    <!-- GM 전용: 멀티맵 드로어 / NPC 배치 / 배경 / 안개 (플레이어 시점이면 숨김) -->
    <button id="map-drawer-btn" style="display:none;" onclick="MapView.toggleDrawer()">☰ 지도</button>
    <button id="map-npc-btn" style="display:none;" onclick="MapView.openNpcCreate()">➕ NPC</button>
    <button id="map-upload-btn" style="display:none;" onclick="MapView.pickBg()">🖼 배경</button>
    <button id="map-fog-btn" style="display:none;" onclick="MapView.toggleFog()">🌫 안개</button>
  </div>
  <div id="map-fog-bar" style="display:none;">
    <button id="map-brush-btn" onclick="MapView.toggleBrush()">✏️ 그리기</button>
    <button id="map-brush-mode" onclick="MapView.toggleBrushMode()">지우개(공개)</button>
    <span class="map-fog-size">붓 <button onclick="MapView.brushSize(-1)">－</button><b id="map-brush-size">중</b><button onclick="MapView.brushSize(1)">＋</button></span>
    <button onclick="MapView.revealAll()">전체공개</button>
    <button onclick="MapView.coverAll()">전체가림</button>
  </div>
  <div id="map-zoom">
    <button onclick="MapView.zoomIn()" aria-label="확대">＋</button>
    <button onclick="MapView.zoomOut()" aria-label="축소">－</button>
  </div>
  <input id="map-bg-input" type="file" accept="image/*" style="display:none;">

  <!-- GM NPC 편집기 (NPC 탭하면 열림 / ➕ NPC로 생성) -->
  <div id="map-npc-editor" style="display:none;">
    <div class="ne-title">NPC 편집</div>
    <div class="ne-row"><label>이름</label><input id="np-name" type="text" onchange="MapView.npcApply()"></div>
    <div class="ne-row"><label>크기</label><select id="np-size" onchange="MapView.npcApply()"></select></div>
    <div class="ne-row"><label class="ne-check"><input id="np-hidden" type="checkbox" onchange="MapView.npcApply()"> 숨김 (플레이어에게 안 보임)</label></div>
    <div class="ne-row ne-actions">
      <button onclick="MapView.npcPickPortrait()">🖼 이미지</button>
      <button class="ne-del" onclick="MapView.npcDelete()">삭제</button>
      <button onclick="MapView.npcClose()">닫기</button>
    </div>
    <input id="np-portrait-input" type="file" accept="image/*" style="display:none;">
  </div>
</div>

<script src="cs_map.js?v=555"></script>
<script>
// ── 지도 전용 글루 (캐릭터 시트와 독립) ──
let currentUser = null;
var state = { portrait: null };          // cs_map.js가 state.portrait 참조 (GM 뷰는 토큰 생성 안 함)
window._mapNoProvision = true;           // 독립 지도 = GM/미리보기 뷰 → 토큰 자동생성 안 함

const _params = new URLSearchParams(location.search);
const _sessionId = _params.get('session');
const _role = _params.get('role') || 'gm';
// GM '플레이어 모드로 보기'(role=player) = 플레이어 시점 안개 + 토큰은 전부 안개 위로(GM이 위치 확인)
window._mapTokensAboveFog = (_role === 'player');

auth.onAuthStateChanged(async function(user) {
  const emptyEl = document.getElementById('map-empty');
  if (!user) {
    emptyEl.style.display = 'flex';
    emptyEl.textContent = '로그인이 필요합니다. 로비(GMSheet)에서 로그인 후 다시 진입하세요.';
    return;
  }
  currentUser = user;
  if (!_sessionId) { alert('세션 ID가 없습니다.'); location.href = 'GMSheet.html'; return; }
  let data;
  try {
    const doc = await db.collection('sessions').doc(_sessionId).get();
    if (!doc.exists) { alert('세션을 찾을 수 없습니다.'); location.href = 'GMSheet.html'; return; }
    data = doc.data();
  } catch (e) { console.error('[Map session]', e); alert('세션 로드 실패: ' + e.message); location.href = 'GMSheet.html'; return; }

  document.getElementById('map-title').textContent = data.name || '세션';
  const isGM = (_role === 'gm');
  document.getElementById('map-role').textContent = isGM ? 'GM 시점' : '플레이어 시점';

  if (typeof MapSync !== 'undefined') MapSync.start(_sessionId, { isGM: isGM, uid: user.uid });
  if (typeof MapView !== 'undefined') { MapView.init(); MapView.show(); }
});
</script>
</body>
</html>
