<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>몬스터 도감 · Pathforge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17130d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pathforge">
<link rel="apple-touch-icon" href="pwa/apple-touch-180.png">
<link rel="icon" type="image/png" href="pwa/favicon-32.png">
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('[PWA SW]',e);});});</script>
<style>
  /* FVTT 양피지 테마 (플레이어 시트와 일관) */
  :root{--bg:#ece1c7;--bg2:#e4d6b5;--bg3:#d9c8a2;--bg4:#ccb78c;--border:#bfa572;--border2:#a3884e;--gold:#6e1414;--accent:#6e1414;--text:#2b2117;--text2:#574021;}
  *{box-sizing:border-box;}
  @font-face{font-family:"EczarBx";font-weight:700;font-display:swap;src:url("fonts/eczar-v16-latin-ext_latin-700.woff2") format("woff2");}
  html,body{margin:0;height:100%;background:#ece1c7 url("data/fvtt-assets/sheet/parchment.webp") repeat;color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
  a{color:var(--gold);}
  /* 헤더 = FVTT 붉은 배너 */
  #bx-top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#5e0000 url("data/fvtt-assets/sheet/red_bg.webp") repeat;border-bottom:2px solid #8a6a1f;position:sticky;top:0;z-index:30;}
  #bx-top h1{margin:0;font-size:17px;font-weight:800;color:#f7e8c8;letter-spacing:.5px;white-space:nowrap;font-family:"EczarBx",serif;}
  #bx-count{font-size:12px;color:var(--text2);}
  #bx-top .spacer{flex:1;}
  .bx-btn{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;}
  .bx-btn:hover{border-color:var(--gold);color:var(--gold);}
  /* 본문 2열 */
  #bx{display:flex;height:calc(100vh - 53px);overflow:hidden;}
  #bx-side{width:340px;min-width:280px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg2);}
  #bx-controls{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
  #bx-search{width:100%;padding:9px 12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px;}
  #bx-search:focus{outline:none;border-color:var(--gold);}
  .bx-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .bx-chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:14px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:.12s;}
  .bx-chip.on{background:var(--gold);color:#f3e2c2;border-color:var(--gold);}
  .bx-row-lbl{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-right:2px;align-self:center;}
  /* 목록 */
  #bx-list{flex:1;overflow-y:auto;padding:6px;}
  .bx-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
  .bx-item:hover{background:var(--bg3);}
  .bx-item.sel{background:var(--bg3);border-color:var(--border2);}
  .bx-lv{flex:none;width:34px;height:34px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border);}
  .bx-lv b{font-size:14px;font-weight:900;color:var(--gold);line-height:1;}
  .bx-lv small{font-size:7px;color:var(--text2);letter-spacing:.5px;}
  .bx-nm{min-width:0;flex:1;}
  .bx-nm .ko{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bx-nm .en{font-size:11px;color:var(--text2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bx-rar{flex:none;width:8px;height:8px;border-radius:50%;}
  .rar-uncommon{background:#d4862a;} .rar-rare{background:#5b8fd4;} .rar-unique{background:#b05bd4;}
  .bx-empty{padding:24px;text-align:center;color:var(--text2);font-size:13px;}
  /* 패널 */
  #bx-panel{flex:1;overflow-y:auto;padding:18px;}
  #bx-sb{max-width:760px;margin:0 auto;}
  .bx-hint{margin:60px auto;max-width:420px;text-align:center;color:var(--text2);font-size:14px;line-height:1.8;}
  .bx-hint .big{font-size:40px;display:block;margin-bottom:10px;opacity:.5;}
  /* 로딩 */
  #bx-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:100;gap:14px;}
  .bx-spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:bxspin .8s linear infinite;}
  @keyframes bxspin{to{transform:rotate(360deg);}}
  /* 다이스 피드백 (cs_dice.js용 — CharacterSheet에서 발췌) */
  #dice-toast-container{position:fixed;top:12px;right:12px;z-index:99999;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-height:60vh;overflow:hidden;}
  .dice-toast{pointer-events:auto;min-width:180px;max-width:260px;background:#1e1e1e;border:1px solid #444;border-left:3px solid #3498db;border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);}
  .dice-toast.show{transform:translateX(0);opacity:1;}
  .dice-toast.hide{transform:translateX(120%);opacity:0;}
  .dice-toast.nat20{border-color:#f1c40f;box-shadow:0 0 20px rgba(241,196,15,.4);}
  .dice-toast.nat1{border-color:#e74c3c;box-shadow:0 0 20px rgba(231,76,60,.3);}
  .dice-toast-who{font-size:10px;font-weight:700;color:#3498db;margin-bottom:2px;}
  .dice-toast-header{display:flex;justify-content:space-between;align-items:center;}
  .dice-toast-label{font-size:11px;color:#999;font-weight:600;}
  .dice-toast-total{font-size:22px;font-weight:900;color:#3498db;}
  .dice-toast.nat20 .dice-toast-total{color:#f1c40f;}
  .dice-toast.nat1 .dice-toast-total{color:#e74c3c;}
  .dice-toast-detail{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
  .dice-result-chip{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;}
  .dice-result-chip.dice-max{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
  .dice-result-chip.dice-min{opacity:.6;}
  #dice-anim-overlay{position:fixed;inset:0;z-index:10020;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;}
  #dice-anim-overlay.active{opacity:1;pointer-events:auto;}
  #dice-anim-overlay.hidden{opacity:0;pointer-events:none;}
  .dice-3d{width:64px;height:64px;position:relative;animation:diceRoll .8s cubic-bezier(.17,.67,.32,1.2) both;perspective:400px;}
  .dice-3d-face{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;background:var(--color,#9b59b6);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.2);animation:diceSpin .7s cubic-bezier(.17,.67,.32,1.2) both;animation-delay:inherit;}
  .dice-3d-label{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--color,#999);opacity:.7;}
  @keyframes diceRoll{0%{transform:translateY(-80px) scale(0.3);opacity:0}40%{transform:translateY(10px) scale(1.1);opacity:1}60%{transform:translateY(-5px) scale(0.98)}100%{transform:translateY(0) scale(1)}}
  @keyframes diceSpin{0%{transform:rotateX(720deg) rotateZ(360deg)}100%{transform:rotateX(0) rotateZ(0)}}
  .dice-anim-total{position:absolute;bottom:24%;left:50%;transform:translateX(-50%);text-align:center;animation:totalPop .4s .6s both;}
  .dice-anim-total-num{display:block;font-size:48px;font-weight:900;color:var(--accent,#d4a04a);text-shadow:0 2px 16px rgba(0,0,0,.6);}
  .dice-anim-total.nat20 .dice-anim-total-num{color:#f1c40f;text-shadow:0 0 24px rgba(241,196,15,.6);}
  .dice-anim-total.nat1 .dice-anim-total-num{color:#e74c3c;}
  .dice-anim-total-label{font-size:12px;color:var(--text2,#999);}
  @keyframes totalPop{0%{transform:translateX(-50%) scale(0);opacity:0}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1);opacity:1}}
  /* 모바일 */
  @media(max-width:820px){
    #bx{flex-direction:column;height:auto;}
    #bx-side{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--border);}
    #bx-panel{height:auto;}
    #dice-toast-container{top:8px;right:8px;left:8px;}
    .dice-toast{max-width:none;}
  }
</style>
</head>
<body>

<div id="bx-loading"><div class="bx-spin"></div><div data-t="몬스터 데이터 불러오는 중…">몬스터 데이터 불러오는 중…</div></div>

<header id="bx-top">
  <h1 data-t="몬스터 도감">몬스터 도감</h1>
  <span id="bx-count"></span>
  <span class="spacer"></span>
  <button class="bx-btn" id="bx-lang" onclick="toggleLang()">EN</button>
</header>

<div id="bx">
  <aside id="bx-side">
    <div id="bx-controls">
      <input id="bx-search" type="text" placeholder="이름 검색 (한글/영문)…" data-t-ph="이름 검색 (한글/영문)…" oninput="onSearch(this.value)">
      <div class="bx-chips" id="bx-src">
        <span class="bx-row-lbl" data-t="출처">출처</span>
      </div>
      <div class="bx-chips" id="bx-band">
        <span class="bx-row-lbl" data-t="레벨">레벨</span>
      </div>
      <div class="bx-chips" id="bx-sort">
        <span class="bx-row-lbl" data-t="정렬">정렬</span>
        <span class="bx-chip on" data-sort="level" onclick="setSort('level')" data-t="레벨순">레벨순</span>
        <span class="bx-chip" data-sort="name" onclick="setSort('name')" data-t="이름순">이름순</span>
      </div>
    </div>
    <div id="bx-list"></div>
  </aside>
  <main id="bx-panel">
    <div id="bx-sb">
      <div class="bx-hint"><span class="big">🐉</span><span data-t="왼쪽 목록에서 몬스터를 선택하세요.">왼쪽 목록에서 몬스터를 선택하세요.</span><br><span data-t="능력치·내성·공격·피해를 클릭하면 주사위가 굴러갑니다.">능력치·내성·공격·피해를 클릭하면 주사위가 굴러갑니다.</span></div>
    </div>
  </main>
</div>

<script src="cs_locale.js?v=0.316"></script>
<script src="cs_dice.js?v=0.316"></script>
<script src="cs_monster.js?v=0.316"></script>
<script>
'use strict';
const SRC_LABEL = {'monster-core':'몬스터 코어','monster-core-2':'몬스터 코어 2','npc-core':'NPC 코어','bestiary':'베스티어리 1','bestiary-2':'베스티어리 2','bestiary-3':'베스티어리 3','hazards':'위험요소','npc-gallery':'NPC 갤러리'};
function srcLabel(s){ return SRC_LABEL[s] || SRC_LABEL[String(s).replace(/^pathfinder-/,'')] || String(s).replace(/^pathfinder-/,''); }
const BANDS = [{k:'all',ko:'전체',lo:-99,hi:99},{k:'0',ko:'0–4',lo:-1,hi:4},{k:'5',ko:'5–9',lo:5,hi:9},{k:'10',ko:'10–14',lo:10,hi:14},{k:'15',ko:'15–19',lo:15,hi:19},{k:'20',ko:'20+',lo:20,hi:99}];
let VM = [];                 // 전체 뷰모델
let _q = '', _src = new Set(), _band = BANDS[0], _sort = 'level', _selId = null;

function t(s){ return (typeof PFLocale!=='undefined') ? PFLocale.t(s) : s; }

async function boot(){
  MonsterDB.injectStyles();
  try { await Promise.all([ MonsterDB.load(), (typeof PFLocale!=='undefined'?PFLocale.load():Promise.resolve()) ]); }
  catch(e){ document.getElementById('bx-loading').innerHTML = '<div style="color:#e07b5c">데이터 로드 실패: '+e.message+'</div>'; return; }
  // 뷰모델 1회 구축
  VM = MonsterDB.all().map(c=>{
    const n = MonsterDB.name(c), tr = MonsterDB.traits(c);
    return { id:c.id, ko:n.ko, en:n.en, level:MonsterDB.level(c), rarity:tr.rarity, size:tr.sizeKo,
             source:c.source, _s:(n.ko+' '+n.en+' '+c.id).toLowerCase() };
  });
  buildChips();
  // 굴림 배선: 패널 컨테이너에 1회 위임 바인드 → 재렌더해도 유지
  MonsterDB.bindRolls(document.getElementById('bx-panel'));
  applyLang();
  render();
  document.getElementById('bx-loading').style.display='none';
}

function buildChips(){
  const srcs = [...new Set(VM.map(v=>v.source))];
  const srcBox = document.getElementById('bx-src');
  srcs.forEach(s=>{
    const c = document.createElement('span'); c.className='bx-chip'; c.dataset.src=s;
    c.dataset.t = srcLabel(s); c.textContent = srcLabel(s);
    c.onclick = ()=>{ if(_src.has(s)) _src.delete(s); else _src.add(s); c.classList.toggle('on'); render(); };
    srcBox.appendChild(c);
  });
  const bandBox = document.getElementById('bx-band');
  BANDS.forEach(b=>{
    const c = document.createElement('span'); c.className='bx-chip'+(b.k==='all'?' on':''); c.dataset.band=b.k;
    c.dataset.t = b.ko; c.textContent = b.ko;
    c.onclick = ()=>{ _band=b; bandBox.querySelectorAll('.bx-chip').forEach(x=>x.classList.toggle('on',x.dataset.band===b.k)); render(); };
    bandBox.appendChild(c);
  });
}

function onSearch(v){ _q = (v||'').trim().toLowerCase(); render(); }
function setSort(s){ _sort=s; document.querySelectorAll('#bx-sort .bx-chip').forEach(x=>x.classList.toggle('on',x.dataset.sort===s)); render(); }

function filtered(){
  let arr = VM.filter(v=>{
    if(_q && !v._s.includes(_q)) return false;
    if(_src.size && !_src.has(v.source)) return false;
    if(v.level < _band.lo || v.level > _band.hi) return false;
    return true;
  });
  if(_sort==='level') arr.sort((a,b)=> a.level-b.level || a.ko.localeCompare(b.ko,'ko'));
  else arr.sort((a,b)=> a.ko.localeCompare(b.ko,'ko'));
  return arr;
}

function render(){
  const list = document.getElementById('bx-list');
  const arr = filtered();
  document.getElementById('bx-count').textContent = arr.length + (arr.length===VM.length?'' : ' / '+VM.length) + (PFLocale&&PFLocale.getLang()==='en'?'':'마리');
  if(!arr.length){ list.innerHTML = '<div class="bx-empty">'+t('검색 결과가 없습니다.')+'</div>'; return; }
  const frag = document.createDocumentFragment();
  for(const v of arr){
    const row = document.createElement('div');
    row.className = 'bx-item'+(v.id===_selId?' sel':''); row.dataset.id=v.id;
    const rar = (v.rarity && v.rarity!=='common') ? '<span class="bx-rar rar-'+v.rarity+'" title="'+v.rarity+'"></span>' : '';
    row.innerHTML =
      '<div class="bx-lv"><b>'+v.level+'</b><small>LV</small></div>'+
      '<div class="bx-nm"><div class="ko">'+esc(v.ko)+'</div><div class="en">'+esc(v.en)+'</div></div>'+rar;
    row.onclick = ()=> select(v.id);
    frag.appendChild(row);
  }
  list.innerHTML=''; list.appendChild(frag);
}

function select(id){
  _selId = id;
  document.querySelectorAll('#bx-list .bx-item').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
  const sb = document.getElementById('bx-sb');
  sb.innerHTML = MonsterDB.renderStatBlock(id);
  document.getElementById('bx-panel').scrollTop = 0;
}

function toggleLang(){
  if(typeof PFLocale==='undefined') return;
  PFLocale.setLang(PFLocale.getLang()==='en'?'ko':'en');
  applyLang(); render();
}
function applyLang(){
  const en = (typeof PFLocale!=='undefined' && PFLocale.getLang()==='en');
  document.getElementById('bx-lang').textContent = en ? '한' : 'EN';
  document.documentElement.lang = en ? 'en' : 'ko';
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-ph]').forEach(el=>{ el.placeholder = t(el.dataset.tPh); });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

boot();
</script>
</body>
</html>
